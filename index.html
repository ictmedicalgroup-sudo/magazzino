<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Group · Gestione Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Raleway','Segoe UI',sans-serif;background:#f4f5f4;color:#2c2e2f;min-height:100vh;}
:root{
  --verde:#9DBF60;--verde-scuro:#7a9e44;--verde-chiaro:#D5E3B7;--verde-pale:#eef4e3;
  --grigio:#77797A;--grigio-scuro:#4a4c4d;--grigio-chiaro:#c8c9ca;--grigio-sfondo:#f4f5f4;
  --bianco:#ffffff;--rosso:#c0392b;--rosso-chiaro:#fdf0ee;
  --arancio:#e67e22;--arancio-chiaro:#fef5ec;
  --testo:#2c2e2f;--bordo:#e2e4e2;
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--grigio-chiaro);border-radius:3px;}
input,select{font-family:inherit;}
input:focus,select:focus{outline:none;border-color:var(--verde)!important;box-shadow:0 0 0 3px #9DBF6022;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:18px;height:18px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG SUPABASE
// ════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://iczsdqcnvauopwkuspti.supabase.co';
const SUPA_KEY = 'sb_publishable_vijGmY6ZHzPiJ0XhGSLgug_Hqpzym5V';

const headers = {
  'Content-Type': 'application/json',
  'apikey': SUPA_KEY,
  'Authorization': `Bearer ${SUPA_KEY}`,
  'Prefer': 'return=representation'
};

// ── Supabase REST helpers ─────────────────────────────────────
const db = {
  async select(table, params=''){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {headers});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async insert(table, data){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method:'POST', headers, body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async update(table, data, filter){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method:'PATCH', headers, body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async delete(table, filter){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method:'DELETE', headers
    });
    if(!r.ok) throw new Error(await r.text());
  }
};

// ── Helpers ───────────────────────────────────────────────────
const uid    = () => Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
const nowStr = () => new Date().toLocaleString('it-IT');
const fmt    = n  => Number(n).toLocaleString('it-IT');
const fmtData= iso => iso ? iso.split('-').reverse().join('/') : '—';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function exportCSV(rows, cols, filename){
  const h = cols.map(c=>c.label).join(';');
  const b = rows.map(r=>cols.map(c=>'"'+String(r[c.key]??'').replace(/"/g,"'")+'"').join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+h+'\n'+b],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

// ── State ─────────────────────────────────────────────────────
let state = {
  phase: 'loading',   // loading|setup|login|app
  utente: null,
  articoli: [],
  movimenti: [],
  logEntries: [],
  utenti: [],
  tab: 'Giacenze',
  modal: null,
  toast: null,
  syncing: false,
  isMobile: window.innerWidth < 700,
};

window.addEventListener('resize', ()=>{ state.isMobile = window.innerWidth < 700; render(); });

// ── Giacenze calcolate ────────────────────────────────────────
function calcGiacenze(){
  const g = {};
  state.articoli.forEach(a=>{ g[a.id]={art:a, pezzi:0}; });
  state.movimenti.forEach(m=>{
    if(!g[m.articolo_id]) return;
    g[m.articolo_id].pezzi += m.tipo==='carico' ? m.quantita : -m.quantita;
  });
  return g;
}

// ════════════════════════════════════════════════════════════════
// DATA LOADING
// ════════════════════════════════════════════════════════════════
async function loadAll(){
  const [articoli, movimenti, utenti, log] = await Promise.all([
    db.select('articoli','order=codice.asc'),
    db.select('movimenti','order=data.desc'),
    db.select('utenti','order=created_at.asc'),
    db.select('log_accessi','order=data.desc&limit=500'),
  ]);
  state.articoli   = articoli;
  state.movimenti  = movimenti;
  state.utenti     = utenti;
  state.logEntries = log;
  render();
}

async function init(){
  try {
    const utenti = await db.select('utenti','limit=1');
    if(!utenti.length){ state.phase='setup'; render(); return; }
    state.phase='login'; render();
  } catch(e){
    showToast('Errore connessione database: '+e.message,'error');
    state.phase='login'; render();
  }
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
async function doSetup(nome,username,pass){
  const hash = await sha256(pass);
  const u = {id:uid(),username:username.toLowerCase().trim(),password_hash:hash,
    nome_completo:nome.trim(),ruolo:'admin',attivo:true,created_at:nowStr()};
  await db.insert('utenti',u);
  state.utente = u; state.phase='app';
  await loadAll();
}

async function doLogin(username,pass){
  const utenti = await db.select('utenti',`username=eq.${username.toLowerCase().trim()}`);
  const u = utenti[0];
  if(!u||!u.attivo) throw new Error('Utente non trovato o disabilitato.');
  const hash = await sha256(pass);
  if(hash!==u.password_hash) throw new Error('Password errata.');
  await db.insert('log_accessi',{id:uid(),tipo:'login',utente:u.username,nome_completo:u.nome_completo,data:nowStr()});
  state.utente=u; state.phase='app';
  await loadAll();
}

async function doLogout(){
  await db.insert('log_accessi',{id:uid(),tipo:'logout',utente:state.utente.username,nome_completo:state.utente.nome_completo,data:nowStr()});
  state.utente=null; state.phase='login'; state.tab='Giacenze';
  render();
}

async function doCarico(m){
  const mov = {id:uid(),articolo_id:m.articoloId,tipo:'carico',quantita:m.quantita,
    causale:m.causale,scadenza:m.scadenza||null,note:m.note||null,
    is_scatola:m.isScatola||false,n_scatole:m.nScatole||null,
    utente:state.utente.username,nome_utente:state.utente.nome_completo,data:nowStr()};
  await db.insert('movimenti',mov);
  await db.insert('log_accessi',{id:uid(),tipo:'carico',utente:state.utente.username,
    nome_completo:state.utente.nome_completo,articolo_id:m.articoloId,
    quantita:m.quantita,causale:m.causale,data:nowStr()});
  await loadAll();
}

async function doScarico(m){
  const mov = {id:uid(),articolo_id:m.articoloId,tipo:'scarico',quantita:m.quantita,
    causale:m.causale,scadenza:m.scadenza||null,note:m.note||null,
    is_scatola:m.isScatola||false,n_scatole:m.nScatole||null,
    utente:state.utente.username,nome_utente:state.utente.nome_completo,data:nowStr()};
  await db.insert('movimenti',mov);
  await db.insert('log_accessi',{id:uid(),tipo:'scarico',utente:state.utente.username,
    nome_completo:state.utente.nome_completo,articolo_id:m.articoloId,
    quantita:m.quantita,causale:m.causale,data:nowStr()});
  await loadAll();
}

async function saveArticolo(art, isNew){
  // Gestione valori numerici: parseInt può restituire NaN, che Supabase rifiuta
  const toInt = v => { const n=parseInt(v); return (!isNaN(n)&&n>0)?n:null; };
  const row = {
    id:           art.id||uid(),
    codice:       art.codice,
    barcode:      art.barcode||null,
    nome:         art.nome,
    um:           art.um,
    pezzi_scatola: toInt(art.pezzi_scatola),
    scorta_min:    toInt(art.scorta_min)!==null ? toInt(art.scorta_min) : (toInt(art.scorta_min)===0?0:null),
    created_at:   art.created_at||nowStr()
  };
  // scorta_min può essere 0, quindi gestiamo separatamente
  const sm = parseInt(art.scorta_min);
  row.scorta_min = (!isNaN(sm) && sm>=0) ? sm : null;
  if(isNew) await db.insert('articoli',row);
  else await db.update('articoli',row,`id=eq.${row.id}`);
  await loadAll();
}

async function deleteArticolo(id){
  await db.delete('movimenti',`articolo_id=eq.${id}`);
  await db.delete('articoli',`id=eq.${id}`);
  await loadAll();
}

async function saveUtente(u, isNew){
  if(isNew) await db.insert('utenti',{...u,id:uid(),attivo:true,created_at:nowStr()});
  else await db.update('utenti',u,`id=eq.${u.id}`);
  await loadAll();
}

// ════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════
function showToast(msg,type='ok'){
  state.toast={msg,type};
  render();
  setTimeout(()=>{ state.toast=null; render(); },3000);
}

// ════════════════════════════════════════════════════════════════
// BARCODE SCANNER (lettore fisico)
// ════════════════════════════════════════════════════════════════
let _bcBuf='', _bcLast=0;
document.addEventListener('keydown', e=>{
  if(state.phase!=='app'||state.modal) return;
  const el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')) return;
  const now=Date.now();
  if(now-_bcLast>120) _bcBuf='';
  _bcLast=now;
  if(e.key==='Enter'&&_bcBuf.length>=3){
    const art=findArtByBarcode(_bcBuf.trim());
    if(art) openModal({type:'quick_scan',art});
    else showToast('Barcode non trovato: '+_bcBuf.trim(),'error');
    _bcBuf=''; return;
  }
  if(e.key.length===1) _bcBuf+=e.key;
});

function findArtByBarcode(code){
  return state.articoli.find(a=>
    a.codice.toLowerCase()===code.toLowerCase()||
    (a.barcode&&a.barcode.toLowerCase()===code.toLowerCase())
  );
}

// ════════════════════════════════════════════════════════════════
// MODAL MANAGER
// ════════════════════════════════════════════════════════════════
function openModal(m){ state.modal=m; render(); }
function closeModal(){ state.modal=null; render(); }

// ════════════════════════════════════════════════════════════════
// RENDER ENGINE (vanilla DOM)
// ════════════════════════════════════════════════════════════════
function render(){
  const app = document.getElementById('app');
  if(state.phase==='loading'){ app.innerHTML=loadingHTML(); return; }
  if(state.phase==='setup'){   app.innerHTML=setupHTML();   bindSetup(); return; }
  if(state.phase==='login'){   app.innerHTML=loginHTML();   bindLogin(); return; }
  app.innerHTML=mainHTML();
  bindMain();
}

// ── Loading ───────────────────────────────────────────────────
function loadingHTML(){ return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--grigio);font-size:14px;letter-spacing:2px;">Connessione al database…</div>`; }

// ── Logo SVG ──────────────────────────────────────────────────
function logoSVG(small){
  const w=small?28:36,h=small?22:28;
  return `<svg width="${w}" height="${h}" viewBox="0 0 90 70" fill="none">
    <circle cx="28" cy="22" r="19" stroke="#D5E3B7" stroke-width="3.5" fill="none"/>
    <circle cx="40" cy="38" r="24" stroke="#77797A" stroke-width="3.5" fill="none"/>
  </svg>`;
}
function logoHTML(small=false){ return `
  <div style="display:flex;align-items:center;gap:${small?6:10}px;">
    ${logoSVG(small)}
    <div style="line-height:1.15;">
      <div style="font-weight:300;font-size:${small?11:14}px;letter-spacing:4px;text-transform:uppercase;">
        <span style="color:var(--grigio);">MEDICAL</span><span style="color:var(--verde);">GROUP</span>
      </div>
      ${!small?'<div style="font-size:9px;letter-spacing:2px;color:var(--grigio-chiaro);text-transform:uppercase;font-weight:500;">Gestione Magazzino</div>':''}
    </div>
  </div>`; }

// ── Auth card wrapper ─────────────────────────────────────────
function authCard(content){ return `
  <div style="min-height:100vh;background:var(--grigio-sfondo);display:flex;align-items:center;justify-content:center;padding:16px;">
    <div style="background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 8px 40px #0000001a;border:1px solid var(--bordo);">
      ${content}
    </div>
  </div>`; }

// ── Setup ─────────────────────────────────────────────────────
function setupHTML(){ return authCard(`
  <div style="text-align:center;margin-bottom:28px;">${logoHTML()}<div style="margin-top:20px;font-weight:700;font-size:17px;">Configurazione iniziale</div><div style="font-size:13px;color:var(--grigio);margin-top:6px;">Crea l'account amministratore</div></div>
  <div style="display:flex;flex-direction:column;gap:14px;">
    ${inp('setup-nome','Nome completo','','text',true)}
    ${inp('setup-user','Username','es. mrossi','text',true)}
    ${inp('setup-pass','Password','minimo 6 caratteri','password',true)}
    ${inp('setup-pass2','Conferma password','','password',true)}
    <div id="setup-err"></div>
    <button id="setup-btn" style="${btnStyle('primary',false,true)}">Crea account admin</button>
  </div>`); }

function bindSetup(){
  document.getElementById('setup-btn').onclick = async () => {
    const nome=val('setup-nome'),user=val('setup-user'),pass=val('setup-pass'),pass2=val('setup-pass2');
    const err=document.getElementById('setup-err');
    err.innerHTML='';
    if(!nome||!user||!pass){ err.innerHTML=errBox('Tutti i campi sono obbligatori.'); return; }
    if(pass.length<6){ err.innerHTML=errBox('Password minimo 6 caratteri.'); return; }
    if(pass!==pass2){ err.innerHTML=errBox('Le password non coincidono.'); return; }
    setLoading('setup-btn',true);
    try{ await doSetup(nome,user,pass); }
    catch(e){ err.innerHTML=errBox(e.message); setLoading('setup-btn',false); }
  };
}

// ── Login ─────────────────────────────────────────────────────
function loginHTML(){ return authCard(`
  <div style="text-align:center;margin-bottom:28px;">${logoHTML()}<div style="margin-top:20px;font-size:13px;color:var(--grigio);">Accesso riservato al personale autorizzato</div></div>
  <div style="display:flex;flex-direction:column;gap:14px;">
    ${inp('login-user','Username','','text',true)}
    ${inp('login-pass','Password','','password',true)}
    <div id="login-err"></div>
    <button id="login-btn" style="${btnStyle('primary',false,true)}" >Accedi</button>
  </div>
  <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--grigio-chiaro);">Medical Group · Gestione Magazzino</div>`); }

function bindLogin(){
  const go = async () => {
    const err=document.getElementById('login-err');
    err.innerHTML='';
    setLoading('login-btn',true);
    try{ await doLogin(val('login-user'),val('login-pass')); }
    catch(e){ err.innerHTML=errBox(e.message); setLoading('login-btn',false); }
  };
  document.getElementById('login-btn').onclick=go;
  document.getElementById('login-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

// ── Main App ──────────────────────────────────────────────────
const TABS_USER  = ['Giacenze','Movimenti'];
const TABS_ADMIN = ['Giacenze','Movimenti','Articoli','Scadenze','Utenti','Log'];
const CAUSALI_CARICO  = ['Acquisto','Ricezione da altra sede'];
const CAUSALI_SCARICO = ['Uso','Reso','Scadenza','Invio ad altra sede'];

function mainHTML(){
  const isAdmin = state.utente?.ruolo==='admin';
  const TABS = isAdmin ? TABS_ADMIN : TABS_USER;
  const giacenze = calcGiacenze();
  const alertList = Object.values(giacenze).filter(g=>g.art.scorta_min!=null&&g.pezzi<=g.art.scorta_min);
  const mob = state.isMobile;

  const tabsHTML = TABS.map(t=>`
    <button class="tab-btn" data-tab="${t}" style="background:none;border:none;border-bottom:${t===state.tab?'2px solid var(--verde)':'2px solid transparent'};color:${t===state.tab?'var(--verde)':'var(--grigio)'};cursor:pointer;font-family:inherit;font-weight:600;font-size:${mob?10:12}px;letter-spacing:1.2px;padding:${mob?'10px 12px 8px':'14px 22px 12px'};text-transform:uppercase;white-space:nowrap;flex-shrink:0;">${t}</button>
  `).join('');

  let content='';
  if(state.tab==='Giacenze')  content=renderGiacenze(giacenze,alertList);
  else if(state.tab==='Movimenti') content=renderMovimenti();
  else if(state.tab==='Articoli'&&isAdmin)  content=renderArticoli(giacenze);
  else if(state.tab==='Scadenze'&&isAdmin)  content=renderScadenze();
  else if(state.tab==='Utenti'&&isAdmin)    content=renderUtenti();
  else if(state.tab==='Log'&&isAdmin)       content=renderLog();

  const stats = [
    {label:'Articoli',     val:state.articoli.length,  sub:'in anagrafica',  accent:'var(--verde)'},
    {label:'Sotto scorta', val:alertList.length,        sub:'in alert',       accent:alertList.length>0?'var(--rosso)':'var(--verde)'},
    {label:'Carichi',      val:state.movimenti.filter(m=>m.tipo==='carico').length,  sub:'totali', accent:'var(--verde)'},
    {label:'Scarichi',     val:state.movimenti.filter(m=>m.tipo==='scarico').length, sub:'totali', accent:'var(--grigio)'},
  ].map(s=>`
    <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:14px 18px;min-width:110px;flex:1;border-top:3px solid ${s.accent};flex-shrink:0;">
      <div style="font-size:9px;color:var(--grigio);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">${s.label}</div>
      <div style="font-size:24px;font-weight:700;line-height:1;">${s.val}</div>
      <div style="font-size:10px;color:var(--grigio-chiaro);margin-top:2px;">${s.sub}</div>
    </div>`).join('');

  const alertBanner = alertList.length>0&&state.tab==='Giacenze' ? `
    <div style="background:var(--rosso-chiaro);border:1px solid #c0392b33;border-radius:8px;padding:12px 16px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;">
      <span style="font-size:18px;">⚠️</span>
      <div>
        <div style="font-weight:700;color:var(--rosso);font-size:13px;margin-bottom:4px;">Articoli sotto scorta minima</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--grigio-scuro);">
          ${alertList.map(g=>`<span><b>${g.art.codice}</b> ${g.art.nome}: <span style="color:var(--rosso);font-weight:700;">${fmt(g.pezzi)} ${g.art.um}</span><span style="color:var(--grigio-chiaro);"> / min.${fmt(g.art.scorta_min)}</span></span>`).join('')}
        </div>
      </div>
    </div>` : '';

  const modalHTML = state.modal ? renderModal(giacenze) : '';
  const toastHTML = state.toast ? `<div style="position:fixed;bottom:${mob?80:24}px;right:${mob?12:24}px;background:${state.toast.type==='ok'?'var(--verde)':'var(--rosso)'};color:#fff;font-weight:700;font-size:12px;padding:12px 20px;border-radius:8px;box-shadow:0 8px 32px #0000002a;z-index:9999;animation:slideUp .25s ease;">${state.toast.msg}</div>` : '';

  const fabHTML = mob ? `
    <div style="position:fixed;bottom:20px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:200;">
      <button onclick="openModal({type:'scarico',preselectId:null})" style="width:52px;height:52px;border-radius:50%;background:var(--rosso);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px #c0392b44;">−</button>
      <button onclick="openModal({type:'carico',preselectId:null})"  style="width:52px;height:52px;border-radius:50%;background:var(--verde);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px #9DBF6044;">+</button>
    </div>` : '';

  return `
    <div style="min-height:100vh;background:var(--grigio-sfondo);">
      <!-- HEADER -->
      <div style="background:#fff;border-bottom:1px solid var(--bordo);box-shadow:0 1px 6px #0000000a;position:sticky;top:0;z-index:100;">
        <div style="max-width:1140px;margin:0 auto;padding:0 16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;height:${mob?54:64}px;">
            ${logoHTML(mob)}
            <div style="display:flex;align-items:center;gap:8px;">
              ${state.syncing?'<span style="font-size:10px;color:var(--verde);font-weight:700;">●</span>':''}

function renderGiacenze(giacenze,alertList){
  const search=(window._giacSearch||'').toLowerCase();
  const filtro=window._giacFiltro||'tutti';
  const rows=Object.values(giacenze).filter(g=>{
    const m=!search||g.art.codice.toLowerCase().includes(search)||g.art.nome.toLowerCase().includes(search)||(g.art.barcode&&g.art.barcode.toLowerCase().includes(search));
    const sotto=g.art.scorta_min!=null&&g.pezzi<=g.art.scorta_min;
    if(filtro==='alert'&&!sotto) return false;
    if(filtro==='ok'&&sotto)     return false;
    return m;
  });

  const pillFiltro=(v,l)=>{
    const bg=filtro===v?'var(--verde)':'#fff';
    const cl=filtro===v?'#fff':'var(--grigio)';
    const bd=filtro===v?'var(--verde)':'var(--bordo)';
    return `<button onclick="window._giacFiltro='${v}';updateGiacenzeTable();" style="padding:7px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:${bg};color:${cl};border:1px solid ${bd};">${l}</button>`;
  };

  const rowsHTML = state.isMobile
    ? rows.map(g=>mobileGiacenzaCard(g)).join('')
    : `<div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
            ${['Codice','Barcode','Descrizione','U.M.','Giacenza','Pz/Sc','Scorta min.','Stato',''].map(h=>`<th style="text-align:left;padding:10px 14px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;">${h}</th>`).join('')}
          </tr></thead>
          <tbody>${rows.map(g=>desktopGiacenzaRow(g)).join('')}</tbody>
        </table>
      </div>`;

  return `
    <div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">
        <div style="position:relative;flex:1;min-width:200px;max-width:300px;">
          <input id="giac-search" value="${window._giacSearch||''}" placeholder="🔍  Cerca o scansiona barcode…"
            oninput="window._giacSearch=this.value;updateGiacenzeTable();"
            style="${inpStyle()} padding-right:40px;">
          <button onclick="openCameraFor('giac-search',v=>{window._giacSearch=v;updateGiacenzeTable();})" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--verde-pale);border:1px solid var(--verde-chiaro);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:15px;">📷</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${pillFiltro('tutti','Tutti')}${pillFiltro('alert','⚠ Alert')}${pillFiltro('ok','✓ OK')}
        </div>
        <button onclick="exportGiacenze()" style="${btnStyle('ghost',true)};margin-left:auto;">⬇ CSV</button>
      </div>
      <div id="giac-table-wrap">${rows.length===0?'<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun articolo trovato.</div>':rowsHTML}</div>
    </div>`;
}

function mobileGiacenzaCard(g){
  const sotto=g.art.scorta_min!=null&&g.pezzi<=g.art.scorta_min;
  return `<div style="background:#fff;border:1px solid ${sotto?'var(--rosso)':'var(--bordo)'};border-radius:10px;padding:14px 16px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>${pill(g.art.codice,'var(--grigio)')}<div style="font-weight:600;font-size:14px;margin-top:6px;">${g.art.nome}</div></div>
      <div style="text-align:right;"><div style="font-weight:700;font-size:22px;color:${sotto?'var(--rosso)':g.pezzi<=0?'var(--grigio-chiaro)':'var(--testo)'}">${fmt(g.pezzi)}</div><div style="font-size:11px;color:var(--grigio);">${g.art.um}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
      <div>${g.art.scorta_min!=null?(sotto?pill('⚠ Sotto scorta','var(--rosso)'):pill('✓ OK','var(--verde)')):''}</div>
      <div style="display:flex;gap:8px;">
        <button onclick="openModal({type:'carico',preselectId:'${g.art.id}'})" style="${btnStyle('outline',true)}">↑</button>
        <button onclick="openModal({type:'scarico',preselectId:'${g.art.id}'})" style="${btnStyle('ghost',true)}">↓</button>
      </div>
    </div>
  </div>`;
}

function desktopGiacenzaRow(g){
  const sotto=g.art.scorta_min!=null&&g.pezzi<=g.art.scorta_min;
  const pzSc=g.art.pezzi_scatola&&g.pezzi>0?`<span style="color:var(--grigio-chiaro);font-size:10px;margin-left:6px;">(${Math.floor(g.pezzi/g.art.pezzi_scatola)}sc+${g.pezzi%g.art.pezzi_scatola})</span>`:'';
  return `<tr onmouseover="this.style.background='var(--verde-pale)'" onmouseout="this.style.background='transparent'" style="border-bottom:1px solid var(--bordo);">
    <td style="padding:11px 14px;">${pill(g.art.codice,'var(--grigio)')}</td>
    <td style="padding:11px 14px;font-size:11px;color:var(--grigio-chiaro);font-family:monospace;">${g.art.barcode||'—'}</td>
    <td style="padding:11px 14px;font-weight:600;">${g.art.nome}</td>
    <td style="padding:11px 14px;color:var(--grigio);">${g.art.um}</td>
    <td style="padding:11px 14px;"><span style="font-weight:700;font-size:15px;color:${sotto?'var(--rosso)':g.pezzi<=0?'var(--grigio-chiaro)':'var(--testo)'}">${fmt(g.pezzi)}</span>${pzSc}</td>
    <td style="padding:11px 14px;color:var(--grigio);">${g.art.pezzi_scatola||'—'}</td>
    <td style="padding:11px 14px;color:var(--grigio);">${g.art.scorta_min!=null?fmt(g.art.scorta_min):'—'}</td>
    <td style="padding:11px 14px;">${g.art.scorta_min==null?'<span style="color:var(--grigio-chiaro);font-size:11px;">—</span>':sotto?pill('⚠ Sotto scorta','var(--rosso)'):pill('✓ OK','var(--verde)')}</td>
    <td style="padding:11px 14px;"><div style="display:flex;gap:6px;">
      <button onclick="openModal({type:'carico',preselectId:'${g.art.id}'})" style="${btnStyle('outline',true)}">↑</button>
      <button onclick="openModal({type:'scarico',preselectId:'${g.art.id}'})" style="${btnStyle('ghost',true)}">↓</button>
    </div></td>
  </tr>`;
}

function updateGiacenzeTable(){
  const giacenze=calcGiacenze();
  const search=(window._giacSearch||'').toLowerCase();
  const filtro=window._giacFiltro||'tutti';
  const rows=Object.values(giacenze).filter(g=>{
    const m=!search||g.art.codice.toLowerCase().includes(search)||g.art.nome.toLowerCase().includes(search)||(g.art.barcode&&g.art.barcode.toLowerCase().includes(search));
    const sotto=g.art.scorta_min!=null&&g.pezzi<=g.art.scorta_min;
    if(filtro==='alert'&&!sotto) return false;
    if(filtro==='ok'&&sotto) return false;
    return m;
  });
  const wrap=document.getElementById('giac-table-wrap');
  if(!wrap){ render(); return; }
  if(rows.length===0){
    wrap.innerHTML='<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun articolo trovato.</div>';

          ${['Codice','Barcode','Descrizione','U.M.','Giacenza','Pz/Sc','Scorta min.','Stato',''].map(h=>`<th style="text-align:left;padding:10px 14px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;">${h}</th>`).join('')}

function exportGiacenze(){
  const giacenze=calcGiacenze();
  exportCSV(Object.values(giacenze).map(g=>({

    ? state.articoli.filter(a=>
        a.codice.toLowerCase().includes(search)||
        a.nome.toLowerCase().includes(search)||
        (a.barcode&&a.barcode.toLowerCase().includes(search))
      )
    : state.articoli;

  const rows=articoliFiltrati.map(a=>{ const g=giacenze[a.id]; const sotto=a.scorta_min!=null&&(g?.pezzi??0)<=a.scorta_min; return `
    <tr onmouseover="this.style.background='var(--verde-pale)'" onmouseout="this.style.background='transparent'" style="border-bottom:1px solid var(--bordo);">
      <td style="padding:11px 14px;">${pill(a.codice,'var(--grigio)')}</td>

        <button onclick="openModal({type:'nuovo_art'})" style="${btnStyle('primary',false)}">+ Nuovo articolo</button>
      </div>
      <div id="art-table-wrap">
      ${articoliFiltrati.length===0?'<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">'+(search?'Nessun articolo trovato.':'Nessun articolo. Aggiungine uno per iniziare.')+'</div>':`
        <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
              ${['Codice','Barcode','Descrizione','U.M.','Pz/Sc','Scorta min.','Giacenza',''].map(h=>`<th style="text-align:left;padding:10px 14px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;">${h}</th>`).join('')}

function confirmDeleteArt(id){
  const g=calcGiacenze();
  if(g[id]?.pezzi!==0){ showToast('Impossibile eliminare: giacenza non zero.','error'); return; }
  if(!confirm('Eliminare definitivamente questo articolo e tutti i suoi movimenti?')) return;
  deleteArticolo(id).then(()=>showToast('Articolo eliminato.')).catch(e=>showToast(e.message,'error'));
}

function renderScadenze(){
  const artMap=Object.fromEntries(state.articoli.map(a=>[a.id,a]));
  const today=new Date(); today.setHours(0,0,0,0);

  // Calcola giacenza netta per ogni (articolo, scadenza)
  const lotti={}; // key: "artId|YYYY-MM-DD"
  state.movimenti.forEach(m=>{
    if(!m.scadenza||!artMap[m.articolo_id]) return;
    const k=m.articolo_id+'|'+m.scadenza;
    if(!lotti[k]) lotti[k]={artId:m.articolo_id,scadenza:m.scadenza,pezzi:0};
    lotti[k].pezzi+=m.tipo==='carico'?m.quantita:-m.quantita;
  });

  // Mantieni solo lotti con giacenza positiva, ordina per data scadenza
  const righe=Object.values(lotti)
    .filter(l=>l.pezzi>0)
    .map(l=>({...l,art:artMap[l.artId]}))
    .sort((a,b)=>a.scadenza.localeCompare(b.scadenza));

  if(!righe.length) return '<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessuna scadenza con giacenza disponibile.</div>';

  // Raggruppa per data scadenza
  const gruppi={};
  righe.forEach(r=>{ if(!gruppi[r.scadenza]) gruppi[r.scadenza]=[]; gruppi[r.scadenza].push(r); });

  const statoSc=iso=>{
    const d=new Date(iso); d.setHours(0,0,0,0);
    const diff=Math.round((d-today)/86400000);
    if(diff<0)   return {label:'SCADUTO',       color:'var(--rosso)',  bg:'var(--rosso-chiaro)'};
    if(diff<=30) return {label:`tra ${diff} gg`, color:'var(--arancio)',bg:'var(--arancio-chiaro)'};
    return              {label:`tra ${diff} gg`, color:'var(--verde)', bg:'var(--verde-pale)'};
  };

  // Unica tabella con colonna "Scadenza" — colonne perfettamente allineate tra i gruppi
  const thStyle = 'text-align:left;padding:10px 14px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;';
  const allRows = righe.map(l => {
    const s = statoSc(l.scadenza);
    return `
      <tr style="border-bottom:1px solid var(--bordo);background:${s.label==='SCADUTO'?'var(--rosso-chiaro)':'transparent'};"
        onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
        <td style="padding:10px 14px;white-space:nowrap;">
          <div style="font-weight:700;font-size:13px;">${fmtData(l.scadenza)}</div>
          <div style="margin-top:3px;display:inline-block;background:${s.bg};color:${s.color};border:1px solid ${s.color}44;border-radius:20px;font-size:9px;font-weight:700;padding:1px 8px;letter-spacing:.8px;">${s.label}</div>
        </td>
        <td style="padding:10px 14px;">${pill(l.art.codice,'var(--grigio)')}</td>
        <td style="padding:10px 14px;font-weight:600;">${l.art.nome}</td>
        <td style="padding:10px 14px;color:var(--grigio);">${l.art.um}</td>
        <td style="padding:10px 14px;font-weight:700;font-size:15px;color:${s.label==='SCADUTO'?'var(--rosso)':'var(--testo)'};">${fmt(l.pezzi)}</td>
      </tr>`;
  }).join('');

  return `<div>
    <div style="font-size:11px;color:var(--grigio);margin-bottom:16px;">${righe.length} lotti disponibili · ordinati per data di scadenza</div>
    <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="border-bottom:2px solid var(--bordo);background:var(--grigio-sfondo);">
            <th style="${thStyle}">Scadenza</th>
            <th style="${thStyle}">Codice</th>
            <th style="${thStyle}">Descrizione</th>
            <th style="${thStyle}">U.M.</th>
            <th style="${thStyle}">Qtà disponibile</th>
          </tr>
        </thead>
        <tbody>${allRows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderLog(){
  const search=(window._logSearch||'').toLowerCase();
  const dal=window._logDal||''; const al=window._logAl||'';
  const PER_PAG=10;
  if(!window._logPag) window._logPag=1;
  const LABEL={login:'Login',logout:'Logout',carico:'Carico',scarico:'Scarico',crea_utente:'Nuovo utente',reset_password:'Reset password'};
  const COLOR={login:'var(--verde)',logout:'var(--grigio)',carico:'var(--verde)',scarico:'var(--rosso)',crea_utente:'var(--arancio)',reset_password:'var(--arancio)'};
  const parseD=str=>{ if(!str) return null; const [dp]=str.split(','); const [d,m,y]=dp.trim().split('/'); return new Date(`${y}-${m}-${d}`); };
  const dalD=dal?new Date(dal):null;
  const alD =al ?new Date(al) :null; if(alD) alD.setHours(23,59,59);
  const filtered=state.logEntries.filter(e=>{
    const q=search; const m=!q||e.nome_completo?.toLowerCase().includes(q)||e.utente?.toLowerCase().includes(q)||(LABEL[e.tipo]||e.tipo).toLowerCase().includes(q);
    const d=parseD(e.data); const ok=((!dalD||!d||d>=dalD)&&(!alD||!d||d<=alD));
    return m&&ok;
  });
  const totP=Math.max(1,Math.ceil(filtered.length/PER_PAG));
  const pag=Math.min(window._logPag,totP);
  const rows=filtered.slice((pag-1)*PER_PAG,pag*PER_PAG);
  const pagBtn=(p,label,dis)=>`<button onclick="window._logPag=${p};render();" ${dis?'disabled':''} style="padding:6px 10px;border-radius:6px;border:1px solid ${dis?'var(--bordo)':'var(--bordo)'};background:transparent;color:${dis?'var(--grigio-chiaro)':'var(--grigio)'};cursor:${dis?'not-allowed':'pointer'};font-family:inherit;font-size:12px;">${label}</button>`;
  const pageNums=Array.from({length:totP},(_,i)=>i+1).filter(p=>p===1||p===totP||Math.abs(p-pag)<=1)
    .reduce((acc,p,i,arr)=>{ if(i>0&&p-arr[i-1]>1) acc.push('…'); acc.push(p); return acc; },[])
    .map(p=>p==='…'?`<span style="color:var(--grigio);padding:0 4px;">…</span>`:`<button onclick="window._logPag=${p};render();" style="width:32px;height:32px;border-radius:6px;border:1px solid ${p===pag?'var(--verde)':'var(--bordo)'};background:${p===pag?'var(--verde)':'transparent'};color:${p===pag?'#fff':'var(--grigio)'};cursor:pointer;font-family:inherit;font-weight:600;font-size:12px;">${p}</button>`).join('');
  return `
    <div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">
        <input id="log-search-box" placeholder="🔍  Cerca utente o tipo…" value="${window._logSearch||''}" oninput="window._logSearch=this.value;window._logPag=1;updateLogTable();" style="${inpStyle()};max-width:220px;">
        <div style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--grigio-scuro);font-weight:600;">Dal<input type="date" value="${dal}" onchange="window._logDal=this.value;window._logPag=1;updateLogTable();" style="${inpStyle()};max-width:150px;padding:8px 10px;"></div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--grigio-scuro);font-weight:600;">Al<input type="date" value="${al}" onchange="window._logAl=this.value;window._logPag=1;updateLogTable();" style="${inpStyle()};max-width:150px;padding:8px 10px;"></div>
        <button onclick="window._logSearch='';window._logDal='';window._logAl='';window._logPag=1;var el=document.getElementById('log-search-box');if(el)el.value='';updateLogTable();" style="${btnStyle('ghost',true)}">✕ Reset</button>
        <button onclick="exportLog()" style="${btnStyle('ghost',true)};margin-left:auto;">⬇ CSV</button>
      </div>
      <div id="log-counter" style="font-size:11px;color:var(--grigio);margin-bottom:10px;">${filtered.length} risultati — pagina ${pag} di ${totP}</div>
      <div id="log-table-wrap">
      ${rows.length===0?'<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun accesso registrato.</div>':`
        <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
              ${['Data/Ora','Utente','Tipo','Dettaglio'].map(h=>`<th style="text-align:left;padding:10px 14px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;">${h}</th>`).join('')}
            </tr></thead>
            <tbody>${rows.map(e=>`
              <tr onmouseover="this.style.background='var(--verde-pale)'" onmouseout="this.style.background='transparent'" style="border-bottom:1px solid var(--bordo);">
                <td style="padding:10px 14px;color:var(--grigio);font-size:11px;white-space:nowrap;">${e.data}</td>
                <td style="padding:10px 14px;"><div style="font-weight:600;font-size:13px;">${e.nome_completo||'—'}</div><div style="font-size:11px;color:var(--grigio);">@${e.utente||''}</div></td>
                <td style="padding:10px 14px;">${pill(LABEL[e.tipo]||e.tipo,COLOR[e.tipo]||'var(--grigio)')}</td>
                <td style="padding:10px 14px;color:var(--grigio);font-size:12px;">${e.causale||e.target_user||'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${totP>1?`<div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;">${pagBtn(1,'«',pag<=1)}${pagBtn(pag-1,'‹',pag<=1)}${pageNums}${pagBtn(pag+1,'›',pag>=totP)}${pagBtn(totP,'»',pag>=totP)}</div>`:''}
      `}
      </div>
    </div>`;
}

function updateLogTable(){
  // Aggiorna solo il contenuto del log senza ricostruire i filtri (preserva il focus)
  const LABEL={login:'Login',logout:'Logout',carico:'Carico',scarico:'Scarico',crea_utente:'Nuovo utente',reset_password:'Reset password'};
  const COLOR={login:'var(--verde)',logout:'var(--grigio)',carico:'var(--verde)',scarico:'var(--rosso)',crea_utente:'var(--arancio)',reset_password:'var(--arancio)'};
  const PER_PAG=10;
  const search=(window._logSearch||'').toLowerCase();
  const dal=window._logDal||''; const al=window._logAl||'';
  const parseD=str=>{ if(!str) return null; const [dp]=str.split(','); const [d,m,y]=dp.trim().split('/'); return new Date(`${y}-${m}-${d}`); };
  const dalD=dal?new Date(dal):null;
  const alD=al?new Date(al):null; if(alD) alD.setHours(23,59,59);
  const filtered=state.logEntries.filter(e=>{
    const q=search;
    const m=!q||e.nome_completo?.toLowerCase().includes(q)||e.utente?.toLowerCase().includes(q)||(LABEL[e.tipo]||e.tipo).toLowerCase().includes(q);
    const d=parseD(e.data);
    return m&&(!dalD||!d||d>=dalD)&&(!alD||!d||d<=alD);
  });
  const totP=Math.max(1,Math.ceil(filtered.length/PER_PAG));
  const pag=Math.min(window._logPag||1,totP);
  const rows=filtered.slice((pag-1)*PER_PAG,pag*PER_PAG);

  // Aggiorna contatore
  const counter=document.getElementById('log-counter');
  if(counter) counter.textContent=`${filtered.length} risultati — pagina ${pag} di ${totP}`;

  // Aggiorna tabella
  const wrap=document.getElementById('log-table-wrap');
  if(!wrap){ render(); return; }

  const pagBtn=(p,label,dis)=>`<button onclick="window._logPag=${p};updateLogTable();" ${dis?'disabled':''} style="padding:6px 10px;border-radius:6px;border:1px solid var(--bordo);background:transparent;color:${dis?'var(--grigio-chiaro)':'var(--grigio)'};cursor:${dis?'not-allowed':'pointer'};font-family:inherit;font-size:12px;">${label}</button>`;
  const pageNums=Array.from({length:totP},(_,i)=>i+1)
    .filter(p=>p===1||p===totP||Math.abs(p-pag)<=1)
    .reduce((acc,p,i,arr)=>{ if(i>0&&p-arr[i-1]>1) acc.push('…'); acc.push(p); return acc; },[])
    .map(p=>p==='…'?`<span style="color:var(--grigio);padding:0 4px;">…</span>`
      :`<button onclick="window._logPag=${p};updateLogTable();" style="width:32px;height:32px;border-radius:6px;border:1px solid ${p===pag?'var(--verde)':'var(--bordo)'};background:${p===pag?'var(--verde)':'transparent'};color:${p===pag?'#fff':'var(--grigio)'};cursor:pointer;font-family:inherit;font-weight:600;font-size:12px;">${p}</button>`

          <tr onmouseover="this.style.background='var(--verde-pale)'" onmouseout="this.style.background='transparent'" style="border-bottom:1px solid var(--bordo);">

// Giacenza per lotto: { 'YYYY-MM-DD': pezzi_disponibili }
function calcLottiPerArticolo(articoloId){
  const lotti={};
  state.movimenti.forEach(m=>{
    if(m.articolo_id!==articoloId||!m.scadenza) return;
    if(!lotti[m.scadenza]) lotti[m.scadenza]=0;
    lotti[m.scadenza]+= m.tipo==='carico'?m.quantita:-m.quantita;
  });
  // Rimuovi lotti esauriti o negativi
  Object.keys(lotti).forEach(k=>{ if(lotti[k]<=0) delete lotti[k]; });
  return lotti;
}

// Costruisce la select delle scadenze disponibili per un articolo (scarico)
function buildScadenzaSelect(artId){
  const lotti=calcLottiPerArticolo(artId);
  const art=state.articoli.find(a=>a.id===artId);
  const sorted=Object.entries(lotti).sort(([a],[b])=>a.localeCompare(b));
  if(!sorted.length){
    return `<select id="mov-scad" disabled style="${inpStyle()};opacity:.5;"><option>Nessun lotto disponibile</option></select>`;
  }
  const opts=sorted.map(([data,pz])=>`<option value="${data}">${fmtData(data)} — disponibili: ${fmt(pz)} ${art?.um||''}</option>`).join('');
  return `<select id="mov-scad" onchange="movScadChange('${artId}')" style="${inpStyle()}"><option value="">— seleziona lotto —</option>${opts}</select>`;
}

// Aggiorna info lotto e verifica quantità quando si sceglie la scadenza
function movScadChange(artId){
  const scad=document.getElementById('mov-scad')?.value;
  if(!scad){ document.getElementById('mov-lotto-info').innerHTML=''; return; }
  const lotti=calcLottiPerArticolo(artId);
  const art=state.articoli.find(a=>a.id===artId);
  const disp=lotti[scad]??0;
  document.getElementById('mov-lotto-info').innerHTML=`
    <div style="background:var(--verde-pale);border:1px solid var(--verde-chiaro);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--grigio-scuro);">
      Disponibili per questo lotto: <b style="color:var(--testo);font-size:14px;">${fmt(disp)} ${art?.um||''}</b>
    </div>`;
  // Imposta il max sull'input quantità
  const qtyEl=document.getElementById('mov-qty');
  if(qtyEl){ qtyEl.max=disp; }
  checkQtyScarico();
}

// Controlla quantità scarico vs disponibilità lotto e blocca il pulsante
function checkQtyScarico(){
  const scad=document.getElementById('mov-scad')?.value;
  const artId=document.getElementById('mov-art')?.value;
  const qtyEl=document.getElementById('mov-qty');
  const btn=document.getElementById('mov-submit-btn');
  const errEl=document.getElementById('mov-err');
  if(!scad||!artId||!qtyEl||!btn) return;
  const lotti=calcLottiPerArticolo(artId);
  const disp=lotti[scad]??0;
  const art=state.articoli.find(a=>a.id===artId);
  const qty=parseInt(qtyEl.value)||0;
  if(qty>disp&&qty>0){
    qtyEl.style.borderColor='var(--rosso)';
    qtyEl.style.boxShadow='0 0 0 3px #c0392b22';
    errEl.innerHTML=errBox(`Quantità superiore alla disponibilità del lotto: max ${fmt(disp)} ${art?.um||''}.`);
    btn.disabled=true;
    btn.style.opacity='0.45';
    btn.style.cursor='not-allowed';
  } else {
    qtyEl.style.borderColor='var(--bordo)';
    qtyEl.style.boxShadow='none';
    errEl.innerHTML='';
    btn.disabled=false;
    btn.style.opacity='1';
    btn.style.cursor='pointer';
  }
}

function setModalita(m,artId){
  const art=state.articoli.find(a=>a.id===artId);

    document.getElementById('sc-pz').style.cssText+='background:#fff;color:var(--grigio);border-color:var(--bordo);';
    document.getElementById('sc-sc').style.cssText+='background:var(--verde)11;color:var(--verde);border-color:var(--verde);';
  } else {
    wrap.innerHTML=`<label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">Quantità (${art.um}) <span style="color:var(--verde);">*</span><input type="number" id="mov-qty" min="1" style="${inpStyle()}"></label>`;
    document.getElementById('sc-pz').style.cssText+='background:var(--verde)11;color:var(--verde);border-color:var(--verde);';
    document.getElementById('sc-sc').style.cssText+='background:#fff;color:var(--grigio);border-color:var(--bordo);';
  }
  window._movModalita=m;

async function submitMovimento(tipo){
  const errEl=document.getElementById('mov-err'); errEl.innerHTML='';
  const artId=document.getElementById('mov-art')?.value;
  const art=state.articoli.find(a=>a.id===artId);
  const qtyEl=document.getElementById('mov-qty');
  const scad=document.getElementById('mov-scad')?.value;
  const causale=document.getElementById('mov-causale')?.value;
  const note=document.getElementById('mov-note')?.value;
  if(!artId){ errEl.innerHTML=errBox('Seleziona un articolo.'); return; }
  const modalita=window._movModalita||'pezzi';
  let qty=parseInt(qtyEl?.value)||0;
  if(modalita==='scatole') qty=qty*(art?.pezzi_scatola||0);
  if(qty<=0){ errEl.innerHTML=errBox('Inserisci una quantità valida.'); return; }
  if(!scad){ errEl.innerHTML=errBox('Inserisci la data di scadenza.'); return; }
  if(tipo==='scarico'){
    const lotti=calcLottiPerArticolo(artId);
    const dispLotto=lotti[scad]??0;
    if(qty>dispLotto){ errEl.innerHTML=errBox(`Quantità superiore alla disponibilità del lotto: max ${fmt(dispLotto)} ${art?.um||''}.`); return; }
  }
  const btn=document.querySelector('#mov-form button:last-child');
  if(btn){ btn.innerHTML='<span class="spinner"></span>Salvataggio…'; btn.disabled=true; }
  try{
    const fn=tipo==='carico'?doCarico:doScarico;
    await fn({articoloId:artId,quantita:qty,causale,scadenza:scad,note,
      isScatola:modalita==='scatole',nScatole:modalita==='scatole'?parseInt(qtyEl?.value):null});
    closeModal(); showToast(`${tipo==='carico'?'Carico':'Scarico'} registrato.`);
    window._movModalita='pezzi';
  } catch(e){ errEl.innerHTML=errBox(e.message); if(btn){btn.innerHTML=`Conferma ${tipo}`;btn.disabled=false;} }
}

      <div style="border-top:1px solid var(--bordo);padding-top:14px;display:flex;flex-direction:column;gap:12px;">
        <div style="font-size:10px;color:var(--grigio);font-weight:700;letter-spacing:1px;text-transform:uppercase;">Scatola &amp; Scorta</div>
        <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">Pezzi per scatola (opzionale)<input type="number" id="art-pzsc" min="1" value="${art?.pezzi_scatola||''}" placeholder="es. 100" style="${inpStyle()}"></label>
        <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">Scorta minima (opzionale)<input type="number" id="art-scmin" min="0" value="${art?.scorta_min||''}" placeholder="es. 50" style="${inpStyle()}"></label>
      </div>
      <div id="art-err"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button onclick="closeModal();" style="${btnStyle('ghost',false)}">Annulla</button>
        <button onclick="submitArticolo(${isEdit?`'${art.id}'`:'null'})" style="${btnStyle('primary',false)}">${isEdit?'Salva modifiche':'Crea articolo'}</button>
      </div>
    </div>`;
}

async function submitArticolo(existingId){
  const errEl=document.getElementById('art-err'); errEl.innerHTML='';
  const codice=document.getElementById('art-codice').value.trim().toUpperCase();
  const nome=document.getElementById('art-nome').value.trim();
  if(!codice||!nome){ errEl.innerHTML=errBox('Codice e descrizione obbligatori.'); return; }
  const dup=state.articoli.find(a=>a.codice===codice&&a.id!==existingId);
  if(dup){ errEl.innerHTML=errBox('Codice già esistente.'); return; }
  const pzscVal = document.getElementById('art-pzsc').value.trim();
  const scminVal = document.getElementById('art-scmin').value.trim();
  const art={
    id:existingId||uid(), codice,
    barcode:document.getElementById('art-barcode').value.trim()||null,
    nome, um:document.getElementById('art-um').value,
    pezzi_scatola: pzscVal!=='' ? parseInt(pzscVal) : null,
    scorta_min:    scminVal!=='' ? parseInt(scminVal) : null,
    created_at:nowStr()
  };
  try{ await saveArticolo(art,!existingId); closeModal(); showToast(existingId?'Articolo aggiornato.':'Articolo creato.'); }
  catch(e){ errEl.innerHTML=errBox(e.message); }
}

async function submitNuovoUtente(){
  const errEl=document.getElementById('nu-err'); errEl.innerHTML='';
  const nome=document.getElementById('nu-nome').value.trim();
  const user=document.getElementById('nu-user').value.trim().toLowerCase();
  const pass=document.getElementById('nu-pass').value;
  const ruolo=document.getElementById('nu-ruolo').value;
  if(!nome||!user||!pass){ errEl.innerHTML=errBox('Tutti i campi sono obbligatori.'); return; }
  if(pass.length<6){ errEl.innerHTML=errBox('Password minimo 6 caratteri.'); return; }
  if(state.utenti.find(u=>u.username===user)){ errEl.innerHTML=errBox('Username già esistente.'); return; }
  const hash=await sha256(pass);
  try{ await saveUtente({username:user,password_hash:hash,nome_completo:nome,ruolo},true); closeModal(); showToast('Utente creato.'); }
  catch(e){ errEl.innerHTML=errBox(e.message); }
}

// Reset password
function resetPassModal(userId,userName){
  return `${modalHeader(`Reset password — ${userName}`)}

      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">Nuova password <span style="color:var(--verde);">*</span><input type="password" id="rp-pass" placeholder="minimo 6 caratteri" style="${inpStyle()}"></label>

      <div id="rp-err"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button onclick="closeModal();" style="${btnStyle('ghost',false)}">Annulla</button>

async function submitResetPass(userId){
  const errEl=document.getElementById('rp-err'); errEl.innerHTML='';
  const pass=document.getElementById('rp-pass').value;
  const pass2=document.getElementById('rp-pass2').value;
  if(!pass){ errEl.innerHTML=errBox('Inserisci la nuova password.'); return; }
  if(pass.length<6){ errEl.innerHTML=errBox('Minimo 6 caratteri.'); return; }
  if(pass!==pass2){ errEl.innerHTML=errBox('Le password non coincidono.'); return; }
  const hash=await sha256(pass);
  try{
    await db.update('utenti',{password_hash:hash},`id=eq.${userId}`);
    await db.insert('log_accessi',{id:uid(),tipo:'reset_password',utente:state.utente.username,nome_completo:state.utente.nome_completo,target_user:userId,data:nowStr()});
    await loadAll(); closeModal(); showToast('Password aggiornata.');
  } catch(e){ errEl.innerHTML=errBox(e.message); }
}

// ════════════════════════════════════════════════════════════════
// CAMERA SCANNER
// ════════════════════════════════════════════════════════════════
function openCameraFor(inputId, callback){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000000ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:16px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;overflow:hidden;width:100%;max-width:500px;box-shadow:0 24px 80px #000;">
      <div style="background:#2c2e2f;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
        <span style="color:#fff;font-weight:700;font-size:14px;">📷 Scansione barcode</span>
        <button id="cam-close" style="background:none;border:none;color:#fff;cursor:pointer;font-size:22px;line-height:1;padding:0 4px;">×</button>
      </div>
      <!-- Tab switcher -->
      <div style="display:flex;border-bottom:1px solid #e2e4e2;">
        <button id="tab-live" onclick="camSwitchTab('live')" style="flex:1;padding:10px;border:none;background:#eef4e3;color:#9DBF60;font-weight:700;font-size:12px;cursor:pointer;border-bottom:2px solid #9DBF60;">📹 Live</button>
        <button id="tab-foto" onclick="camSwitchTab('foto')" style="flex:1;padding:10px;border:none;background:#fff;color:#77797A;font-weight:600;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;">📸 Foto</button>
      </div>
      <!-- Live scanner -->
      <div id="panel-live">
        <div style="position:relative;background:#000;min-height:240px;">
          <video id="cam-video" autoplay playsinline muted style="width:100%;max-height:300px;display:block;object-fit:cover;"></video>
          <canvas id="cam-canvas" style="display:none;"></canvas>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="width:75%;max-width:280px;height:120px;border:2.5px solid #9DBF60;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);"></div>
          </div>
        </div>
        <div id="cam-status" style="padding:10px 16px;text-align:center;font-size:12px;color:#77797A;min-height:34px;">Avvio fotocamera…</div>
        <div id="cam-debug"  style="padding:0 16px 2px;text-align:center;font-size:10px;color:#c8c9ca;font-family:monospace;min-height:14px;"></div>
      </div>
      <!-- Foto upload (fallback) -->
      <div id="panel-foto" style="display:none;padding:24px 16px;text-align:center;">
        <div style="font-size:13px;color:#77797A;margin-bottom:16px;">Scatta una foto al barcode o selezionane una dalla galleria</div>
        <label style="display:inline-block;background:#9DBF60;color:#fff;border-radius:6px;padding:12px 24px;cursor:pointer;font-weight:700;font-size:13px;">
          📷 Apri fotocamera
          <input id="cam-file" type="file" accept="image/*" capture="environment" style="display:none;">
        </label>
        <div style="margin-top:12px;">
          <label style="display:inline-block;background:transparent;color:#77797A;border:1px solid #e2e4e2;border-radius:6px;padding:10px 20px;cursor:pointer;font-size:12px;">
            🖼 Dalla galleria
            <input id="cam-gallery" type="file" accept="image/*" style="display:none;">
          </label>
        </div>
        <div id="foto-status" style="margin-top:14px;font-size:12px;color:#77797A;min-height:20px;"></div>
        <canvas id="foto-canvas" style="display:none;max-width:100%;border-radius:6px;margin-top:8px;"></canvas>
      </div>
      <div style="padding:8px 16px 16px;display:flex;justify-content:center;">
        <button id="cam-cancel" style="background:transparent;color:#77797A;border:1px solid #e2e4e2;border-radius:6px;font-family:inherit;font-weight:600;font-size:13px;padding:10px 22px;cursor:pointer;">Annulla</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let stream = null, active = true, zxReader = null;
  const $ = id => overlay.querySelector('#'+id);
  const st = t => { const el=$('cam-status'); if(el) el.textContent=t; };
  const db = t => { const el=$('cam-debug');  if(el) el.textContent=t; };
  const fs = t => { const el=$('foto-status');if(el) el.textContent=t; };

  const done = val => {
    active = false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    overlay.remove();
    callback(val);
  };
  const cancel = () => {
    active = false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    overlay.remove();
  };

  $('cam-close').onclick  = cancel;
  $('cam-cancel').onclick = cancel;

  // ── Tab switcher ────────────────────────────────────────────────
  window.camSwitchTab = tab => {
    $('panel-live').style.display = tab==='live' ? '' : 'none';
    $('panel-foto').style.display = tab==='foto' ? '' : 'none';
    $('tab-live').style.cssText += tab==='live'
      ? 'background:#eef4e3;color:#9DBF60;border-bottom-color:#9DBF60;font-weight:700;'
      : 'background:#fff;color:#77797A;border-bottom-color:transparent;font-weight:600;';
    $('tab-foto').style.cssText += tab==='foto'
      ? 'background:#eef4e3;color:#9DBF60;border-bottom-color:#9DBF60;font-weight:700;'
      : 'background:#fff;color:#77797A;border-bottom-color:transparent;font-weight:600;';
  };

  // ── Foto upload handler ─────────────────────────────────────────
  const handleFileInput = async file => {
    if(!file) return;
    fs('Analisi immagine…');
    const img = new Image();
    img.onload = async () => {
      const fc = $('foto-canvas');
      const scale = Math.min(800/Math.max(img.width,img.height), 1);
      fc.width  = Math.round(img.width*scale);
      fc.height = Math.round(img.height*scale);
      fc.style.display = 'block';
      const ctx = fc.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img, 0, 0, fc.width, fc.height);

      // Prova BarcodeDetector
      if(typeof BarcodeDetector !== 'undefined'){
        try {
          const det = new BarcodeDetector({formats:['ean_13','ean_8','qr_code','code_128','code_39','itf','upc_a','upc_e','data_matrix']});
          const res = await det.detect(fc);
          if(res.length){ fs('✅ Letto!'); setTimeout(()=>done(res[0].rawValue),300); return; }
        } catch{}
      }
      // Prova ZXing se disponibile
      if(zxReader){
        try {
          const imgData = ctx.getImageData(0,0,fc.width,fc.height);
          const lum = new zxReader.ZX.RGBLuminanceSource(imgData.data,fc.width,fc.height);
          const bmp = new zxReader.ZX.BinaryBitmap(new zxReader.ZX.HybridBinarizer(lum));
          const r = zxReader.reader.decode(bmp);
          if(r){ fs('✅ Letto!'); setTimeout(()=>done(r.getText()),300); return; }
        } catch{}
      }
      fs('⚠️ Barcode non trovato. Riprova con foto più nitida e ravvicinata.');
    };
    img.src = URL.createObjectURL(file);
  };

  $('cam-file').onchange    = e => handleFileInput(e.target.files[0]);
  $('cam-gallery').onchange = e => handleFileInput(e.target.files[0]);

  // ── Live scanner ────────────────────────────────────────────────
  (async () => {
    try {
      // getUserMedia PRIMA di qualsiasi await (requisito Safari iOS)
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'environment', width:{ideal:1280,max:1920}, height:{ideal:720,max:1920} }
      });
      const video = $('cam-video');
      video.srcObject = stream;
      await new Promise(res=>{ video.onloadedmetadata=()=>video.play().then(res).catch(res); setTimeout(res,4000); });
      if(!active) return;
      const vw = video.videoWidth||1280, vh = video.videoHeight||720;

      // ── Strategia A: BarcodeDetector nativa ─────────────────────
      if(typeof BarcodeDetector !== 'undefined'){
        let fmts=['qr_code','ean_13','ean_8','code_128','code_39','itf','upc_a','upc_e','data_matrix','aztec','pdf417'];
        try{ fmts=await BarcodeDetector.getSupportedFormats(); }catch{}
        const det = new BarcodeDetector({formats:fmts});
        st('Punta il barcode nel riquadro verde…');
        db(`${vw}x${vh} | BarcodeDetector`);
        let last=0, n=0;
        const tick = async()=>{
          if(!active) return;
          const now=Date.now();
          if(now-last>=300 && video.readyState>=2){
            last=now; n++;
            try{
              const r=await det.detect(video);
              if(r.length){ done(r[0].rawValue); return; }
            }catch(e){ db(`BD err:${e.message}`); }
            if(n%6===0) db(`${vw}x${vh} | BD | frame ${n}`);
          }
          if(active) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        return;
      }

      // ── Strategia B: ZXing UMD con preloading ───────────────────
      st('Caricamento decoder…');
      const CDNS=[
        'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.2/umd/index.min.js',
        'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js',
        'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js',
      ];
      if(!window.ZXing){
        let ok=false;
        for(const url of CDNS){
          try{
            await new Promise((res,rej)=>{
              const s=document.createElement('script');
              s.src=url; s.onload=res; s.onerror=()=>rej();
              document.head.appendChild(s);
            });
            ok=true; break;
          }catch{ continue; }
        }
        if(!ok){
          st('⚠️ Decoder non caricabile. Usa il tab 📸 Foto.');
          db('Nessuna CDN raggiungibile');
          return;
        }
      }

      const ZX=window.ZXing;
      const hints=new Map();
      hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[
        ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,
        ZX.BarcodeFormat.QR_CODE,ZX.BarcodeFormat.CODE_128,
        ZX.BarcodeFormat.CODE_39,ZX.BarcodeFormat.DATA_MATRIX,
        ZX.BarcodeFormat.ITF,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E,
      ]);
      hints.set(ZX.DecodeHintType.TRY_HARDER,true);
      const reader=new ZX.MultiFormatReader();
      reader.setHints(hints);
      // Salva riferimento per uso in foto-upload
      zxReader={ZX,reader};

      const canvas=$('cam-canvas');
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      // ZXing funziona meglio con immagini tra 400-700px
      const scale=Math.min(640/Math.max(vw,vh),1);
      const cw=Math.round(vw*scale), ch=Math.round(vh*scale);
      canvas.width=cw; canvas.height=ch;

      st('Punta il barcode nel riquadro verde…');
      db(`${vw}x${vh}→${cw}x${ch} | ZXing`);

      const tryZX=(data,w,h)=>{
        try{
          const lum=new ZX.RGBLuminanceSource(data,w,h);
          const bmp=new ZX.BinaryBitmap(new ZX.HybridBinarizer(lum));
          return reader.decode(bmp).getText();
        }catch{ return null; }
      };

      let last=0, n=0;
      const tick=()=>{
        if(!active) return;
        const now=Date.now();
        if(now-last>=80 && video.readyState>=2){
          last=now; n++;
          ctx.drawImage(video,0,0,cw,ch);
          // 1. Frame intero
          let r=tryZX(ctx.getImageData(0,0,cw,ch).data,cw,ch);
          // 2. Crop centrale 70%
          if(!r){
            const x=Math.round(cw*.15),y=Math.round(ch*.15);
            const w2=Math.round(cw*.7),h2=Math.round(ch*.7);
            if(w2>20&&h2>20) r=tryZX(ctx.getImageData(x,y,w2,h2).data,w2,h2);
          }
          // 3. Crop banda orizzontale centrale (ottimale per EAN)
          if(!r){
            const y3=Math.round(ch*.3),h3=Math.round(ch*.4);
            if(h3>10) r=tryZX(ctx.getImageData(0,y3,cw,h3).data,cw,h3);
          }
          if(r){ done(r); return; }
          if(n%20===0) db(`${cw}x${ch} | ZXing | frame ${n}`);
        }
        if(active) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

    }catch(e){
      let msg='⚠️ Fotocamera non disponibile.';
      if(e.name==='NotAllowedError') msg='⚠️ Permesso negato → Impostazioni → Safari → Fotocamera → Consenti';
      else if(e.name==='NotFoundError') msg='⚠️ Nessuna fotocamera trovata.';
      else if(e.message) msg='⚠️ '+e.message;
      st(msg); db(e.name||'');
      // In caso di errore fotocamera, switcha automaticamente su tab foto
      camSwitchTab('foto');
    }
  })();
}

// STYLE HELPERS
// ════════════════════════════════════════════════════════════════
function inpStyle(){ return 'background:#fff;border:1.5px solid var(--bordo);border-radius:6px;color:var(--testo);font-family:inherit;font-size:14px;padding:10px 12px;width:100%;'; }
function btnStyle(variant='primary',small=false,full=false){
  const V={
    primary:'background:var(--verde);color:#fff;border:none;box-shadow:0 2px 8px #9DBF6044;',
    danger:'background:var(--rosso);color:#fff;border:none;',
    ghost:'background:transparent;color:var(--grigio);border:1px solid var(--bordo);',
    outline:'background:transparent;color:var(--verde);border:1px solid var(--verde);',
  };
  return `${V[variant]||V.primary}border-radius:6px;font-family:inherit;font-weight:600;font-size:${small?11:13}px;padding:${small?'6px 14px':'10px 22px'};cursor:pointer;letter-spacing:.3px;${full?'width:100%;':''}`;
}
function pill(text,color='var(--verde)'){ return `<span style="background:${color}22;color:${color};border:1px solid ${color}55;border-radius:20px;font-size:10px;font-weight:700;padding:2px 9px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;">${text}</span>`; }
function inp(id,label,placeholder,type='text',required=false){ return `<label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">${label}${required?'<span style="color:var(--verde);"> *</span>':''}<input id="${id}" type="${type}" placeholder="${placeholder}" style="${inpStyle()}"></label>`; }
function val(id){ return document.getElementById(id)?.value||''; }
function errBox(msg){ return `<div style="background:var(--rosso-chiaro);border:1px solid #c0392b44;border-radius:6px;color:var(--rosso);font-size:12px;padding:10px 14px;margin-top:10px;">${msg}</div>`; }
function setLoading(btnId,on){ const b=document.getElementById(btnId); if(b){ b.disabled=on; b.innerHTML=on?'<span class="spinner"></span>Caricamento…':b.innerHTML; } }

// ════════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════════
init();
</script>
