  if(!codice||!nome){ errEl.innerHTML=errBox('Descrizione obbligatoria.'); return; }
  // Per i nuovi articoli il codice è auto-generato, non può essere duplicato
  // Per le modifiche controlliamo solo conflitti con altri articoli
  if(existingId){
    const dup=state.articoli.find(a=>a.codice===codice&&a.id!==existingId);
    if(dup){ errEl.innerHTML=errBox('Codice già esistente.'); return; }
  }
  const tipo_id=document.getElementById('art-tipo').value||null;
  const mags=leggiArtMags();
  if(!mags.length){ errEl.innerHTML=errBox("Abilita l'articolo in almeno un magazzino."); return; }
  const tipoSel=state.tipi.find(t=>t.id===tipo_id);
  const nonAmm=tipoSel?mags.filter(x=>!tipoMags(tipoSel).includes(x.magazzino)):[];
  if(nonAmm.length){ errEl.innerHTML=errBox(`Il tipo "${escHtml(tipoSel.nome)}" non è abilitato in ${nonAmm.map(x=>magNome(x.magazzino)).join(' e ')}.`); return; }
  if(existingId){
    for(const id of artMagsOf(existingId).filter(id=>!mags.some(x=>x.magazzino===id))){
      const pz=giacRaw(existingId,id);
      if(pz!==0){ errEl.innerHTML=errBox(`Non puoi togliere ${magNome(id)}: l'articolo ha ancora ${fmt(pz)} pezzi in quel magazzino. Scaricali o spostali prima.`); return; }
    }
  }
  const art={
    id:existingId||uid(), codice,
    barcode:document.getElementById('art-barcode').value.trim()||null,
    nome, um:document.getElementById('art-um').value,
    tipo_id,
    frigo:document.getElementById('art-frigo').checked,
    note:document.getElementById('art-note').value.trim()||null,
    flag:document.getElementById('art-flag').value||null,
    mags,
    created_at:nowStr()
  };
  const btnSave=document.getElementById('art-save-btn');
  const lblSave=existingId?'Salva modifiche':'Crea articolo';
  try{
    if(btnSave){ btnSave.disabled=true; btnSave.innerHTML='<span class="spinner"></span>Salvataggio…'; }
    await saveArticolo(art,!existingId);
  }catch(e){ errEl.innerHTML=errBox(e.message); if(btnSave){ btnSave.disabled=false; btnSave.innerHTML=lblSave; } return; }
  const s=window._artImg;
  if(s&&(s.file||s.remove)){
    if(btnSave) btnSave.innerHTML='<span class="spinner"></span>'+(s.file?'Caricamento immagine…':'Rimozione immagine…');
    try{ await syncArtImage(art.id,codice); await loadAll(); }
    catch(e){ closeModal(); showToast("Articolo salvato, ma l'immagine non è stata aggiornata: "+e.message,'error'); return; }
  }
  closeModal(); showToast(existingId?'Articolo aggiornato.':'Articolo creato.');
}

// Nuovo utente
function nuovoUtenteModal(){
  return `${modalHeader('Nuovo utente')}
    <div style="display:flex;flex-direction:column;gap:14px;">
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>Nome completo <span style="color:var(--verde);">*</span></span><input id="nu-nome" style="${inpStyle()}"></label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>Username <span style="color:var(--verde);">*</span></span><input id="nu-user" placeholder="es. mrossi" style="${inpStyle()}"></label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>Password temporanea <span style="color:var(--verde);">*</span></span><input type="password" id="nu-pass" placeholder="minimo 6 caratteri" style="${inpStyle()}"></label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">Ruolo
        <select id="nu-ruolo" onchange="document.getElementById('nu-mags').style.display=this.value==='admin'?'none':'flex';" style="${inpStyle()}"><option value="operatore">Operatore (solo carico/scarico)</option><option value="admin">Amministratore (accesso completo)</option></select>
      </label>
      <div id="nu-mags" style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--grigio-scuro);font-weight:600;">
        <span>Accesso ai magazzini <span style="color:var(--verde);">*</span></span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${MAGAZZINI.map(m=>`<label style="flex:1;min-width:140px;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bordo);border-left:4px solid ${m.color};border-radius:6px;cursor:pointer;font-weight:600;"><input type="checkbox" id="nu-mag-${m.id}" ${m.id===state.mag?'checked':''} style="width:15px;height:15px;accent-color:${m.color};cursor:pointer;">${m.nome}</label>`).join('')}
        </div>
        <span style="font-size:11px;color:var(--grigio);font-weight:400;">Gli amministratori accedono sempre a tutti i magazzini.</span>
      </div>
      <div id="nu-err"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button onclick="closeModal();" style="${btnStyle('ghost',false)}">Annulla</button>
        <button onclick="submitNuovoUtente()" style="${btnStyle('primary',false)}">Crea utente</button>
      </div>
    </div>`;
}

async function submitNuovoUtente(){
  const errEl=document.getElementById('nu-err'); errEl.innerHTML='';
  const nome=document.getElementById('nu-nome').value.trim();
  const user=document.getElementById('nu-user').value.trim().toLowerCase();
  const pass=document.getElementById('nu-pass').value;
  const ruolo=document.getElementById('nu-ruolo').value;
  if(!nome||!user||!pass){ errEl.innerHTML=errBox('Tutti i campi sono obbligatori.'); return; }
  if(pass.length<6){ errEl.innerHTML=errBox('Password minimo 6 caratteri.'); return; }
  if(state.utenti.find(u=>u.username===user)){ errEl.innerHTML=errBox('Username già esistente.'); return; }
  const magazzini=ruolo==='admin'?MAGAZZINI.map(m=>m.id):MAGAZZINI.filter(m=>document.getElementById('nu-mag-'+m.id)?.checked).map(m=>m.id);
  if(!magazzini.length){ errEl.innerHTML=errBox('Seleziona almeno un magazzino.'); return; }
  const hash=await sha256(pass);
  try{ await saveUtente({username:user,password_hash:hash,nome_completo:nome,ruolo,magazzini},true); closeModal(); showToast('Utente creato.'); }
  catch(e){ errEl.innerHTML=errBox(e.message); }
}

// Reset password
function resetPassModal(userId,userName){
  return `${modalHeader(`Reset password — ${userName}`)}
    <div style="display:flex;flex-direction:column;gap:14px;">
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>Nuova password <span style="color:var(--verde);">*</span></span><input type="password" id="rp-pass" placeholder="minimo 6 caratteri" style="${inpStyle()}"></label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>Conferma password <span style="color:var(--verde);">*</span></span><input type="password" id="rp-pass2" style="${inpStyle()}"></label>
      <div id="rp-err"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button onclick="closeModal();" style="${btnStyle('ghost',false)}">Annulla</button>
        <button onclick="submitResetPass('${userId}')" style="${btnStyle('primary',false)}">Aggiorna password</button>
      </div>
    </div>`;
}

async function submitResetPass(userId){
  const errEl=document.getElementById('rp-err'); errEl.innerHTML='';
  const pass=document.getElementById('rp-pass').value;
  const pass2=document.getElementById('rp-pass2').value;
  if(!pass){ errEl.innerHTML=errBox('Inserisci la nuova password.'); return; }
  if(pass.length<6){ errEl.innerHTML=errBox('Minimo 6 caratteri.'); return; }
  if(pass!==pass2){ errEl.innerHTML=errBox('Le password non coincidono.'); return; }
  const hash=await sha256(pass);
  try{
    await db.update('magazzino_utenti',{password_hash:hash},`id=eq.${userId}`);
    await db.insert('magazzino_log_accessi',{id:uid(),tipo:'reset_password',utente:state.utente.username,nome_completo:state.utente.nome_completo,target_user:userId,data:nowStr()});
    await loadAll(); closeModal(); showToast('Password aggiornata.');
  } catch(e){ errEl.innerHTML=errBox(e.message); }
}

function inpStyle(){ return 'background:#fff;border:1.5px solid var(--bordo);border-radius:6px;color:var(--testo);font-family:inherit;font-size:14px;padding:10px 12px;width:100%;'; }
function btnStyle(variant='primary',small=false,full=false){
  const V={
    primary:'background:var(--verde);color:#fff;border:none;box-shadow:0 2px 8px #9DBF6044;',
    danger:'background:var(--rosso);color:#fff;border:none;',
    ghost:'background:transparent;color:var(--grigio);border:1px solid var(--bordo);',
    outline:'background:transparent;color:var(--verde);border:1px solid var(--verde);',
  };
  return `${V[variant]||V.primary}border-radius:6px;font-family:inherit;font-weight:600;font-size:${small?11:13}px;padding:${small?'6px 14px':'10px 22px'};cursor:pointer;letter-spacing:.3px;${full?'width:100%;':''}`;
}
function pill(text,color='var(--verde)'){ return `<span style="background:${color}22;color:${color};border:1px solid ${color}55;border-radius:20px;font-size:10px;font-weight:700;padding:2px 9px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;">${text}</span>`; }
function inp(id,label,placeholder,type='text',required=false){ return `<label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grigio-scuro);font-weight:600;"><span>${label}${required?'<span style="color:var(--verde);"> *</span>':''}</span><input id="${id}" type="${type}" placeholder="${placeholder}" style="${inpStyle()}"></label>`; }
function val(id){ return document.getElementById(id)?.value||''; }
function errBox(msg){ return `<div style="background:var(--rosso-chiaro);border:1px solid #c0392b44;border-radius:6px;color:var(--rosso);font-size:12px;padding:10px 14px;margin-top:10px;">${msg}</div>`; }
function setLoading(btnId,on){ const b=document.getElementById(btnId); if(b){ b.disabled=on; b.innerHTML=on?'<span class="spinner"></span>Caricamento…':b.innerHTML; } }
