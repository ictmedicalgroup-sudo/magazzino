<script>
// ════════════════════════════════════════════════════════════════
// CONFIG SUPABASE
// ════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://iczsdqcnvauopwkuspti.supabase.co';
const SUPA_KEY = 'sb_publishable_vijGmY6ZHzPiJ0XhGSLgug_Hqpzym5V';

const headers = {
  'Content-Type': 'application/json',
  'apikey': SUPA_KEY,
  'Authorization': `Bearer ${SUPA_KEY}`,
  'Prefer': 'return=representation'
};

// ── Supabase REST helpers ─────────────────────────────────────
const db = {
  async select(table, params=''){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {headers});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  // Legge TUTTE le righe a pagine: Supabase restituisce al massimo 1000 righe per richiesta.
  // L'ordinamento deve includere una colonna univoca (es. id) per non perdere o duplicare righe tra le pagine.
  async selectAll(table, params='', pageSize=1000){
    const all=[];
    for(let offset=0;;){
      const page=await this.select(table, `${params}${params?'&':''}limit=${pageSize}&offset=${offset}`);
      if(!page.length) break;
      all.push(...page);
      offset+=page.length;
    }
    return all;
  },
  async insert(table, data){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method:'POST', headers, body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async upsert(table, data, onConflict){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
      method:'POST', headers:{...headers,'Prefer':'resolution=merge-duplicates,return=representation'}, body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async update(table, data, filter){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method:'PATCH', headers, body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async delete(table, filter){
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method:'DELETE', headers
    });
    if(!r.ok) throw new Error(await r.text());
  }
};

// ── Helpers ───────────────────────────────────────────────────
const uid    = () => Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
const nowStr = () => new Date().toLocaleString('it-IT');
const fmt    = n  => Number(n).toLocaleString('it-IT');
const NO_SCAD_ISO = '2126-12-31';
const fmtData = iso => {
  if(!iso) return '—';
  if(iso === NO_SCAD_ISO) return 'ND';
  return iso.split('-').reverse().join('/');
};
const isNoScad = iso => iso === NO_SCAD_ISO;
// "1/10/2026, 15:04:00" o "01/10/2026, 15:04:00" → timestamp (0 se non leggibile)
const parseDataIt = s => {
  const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)).getTime():0;
};
const tipoNome = id => state.tipi.find(t=>t.id===id)?.nome || '—';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function exportCSV(rows, cols, filename){
  const h = cols.map(c=>c.label).join(';');
  const b = rows.map(r=>cols.map(c=>'"'+String(r[c.key]??'').replace(/"/g,"'")+'"').join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+h+'\n'+b],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

// ── State ─────────────────────────────────────────────────────
let state = {
  phase: 'loading',   // loading|setup|login|app
  utente: null,
  articoli: [],
  movimenti: [],
  tipi: [],
  codici: [],
  artMag: [],
  artMagIdx: {},
  mag: 'chirurgia',
  logEntries: [],
  utenti: [],
  tab: 'Giacenze',
  modal: null,
  toast: null,
  syncing: false,
  isMobile: window.innerWidth < 700,
};

window.addEventListener('resize', ()=>{ state.isMobile = window.innerWidth < 700; render(); });

// ── Giacenze calcolate ────────────────────────────────────────
function calcGiacenze(mag=state.mag){
  const g = {};
  state.articoli.forEach(a=>{ if(isEnabled(a.id,mag)) g[a.id]={art:artById(a.id,mag), pezzi:0}; });
  state.movimenti.forEach(m=>{
    if(movMag(m)!==mag||!g[m.articolo_id]) return;
    g[m.articolo_id].pezzi += m.tipo==='carico' ? m.quantita : -m.quantita;
  });
  return g;
}

// ════════════════════════════════════════════════════════════════
// DATA LOADING
// ════════════════════════════════════════════════════════════════
async function loadAll(){
  const [articoli, movimenti, utenti, log, tipi] = await Promise.all([
    db.selectAll('magazzino_articoli','order=codice.asc,id.asc'),
    db.selectAll('magazzino_movimenti','order=id.asc'),
    db.select('magazzino_utenti','order=created_at.asc'),
    db.select('magazzino_log_accessi','order=data.desc&limit=500'),
    db.select('magazzino_articoli_tipo','order=nome.asc'),
  ]);
  // Codici singoli: se la tabella non esiste ancora l'app continua a funzionare
  const codici = await db.selectAll('magazzino_articoli_codici','order=codice.asc,id.asc').catch(()=>[]);
  // La data è salvata come testo (gg/mm/aaaa, hh:mm:ss): ordino i movimenti dal più recente
  movimenti.sort((a,b)=>parseDataIt(b.data)-parseDataIt(a.data));
  // Abilitazione articoli per magazzino (prima della migrazione: tutto in Chirurgia)
  const artMag = await db.selectAll('magazzino_articoli_magazzini','order=articolo_id.asc,magazzino.asc')
    .catch(()=>articoli.map(a=>({articolo_id:a.id,magazzino:'chirurgia',pezzi_scatola:a.pezzi_scatola,scorta_min:a.scorta_min})));
  state.artMag     = artMag;
  buildArtMagIdx();
  if(state.utente){ const me=utenti.find(u=>u.id===state.utente.id); if(me) state.utente={...state.utente,ruolo:me.ruolo,magazzini:me.magazzini}; }
  ensureMag();
  state.codici     = codici;
  state.articoli   = articoli;
  state.movimenti  = movimenti;
  state.utenti     = utenti;
  state.logEntries = log;
  state.tipi       = tipi;
  render();
}

async function init(){
  fetchVersion();
  try {
    const utenti = await db.select('magazzino_utenti','limit=1');
    if(!utenti.length){ state.phase='setup'; render(); return; }
    state.phase='login'; render();
  } catch(e){
    showToast('Errore connessione database: '+e.message,'error');
    state.phase='login'; render();
  }
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
async function doSetup(nome,username,pass){
  const hash = await sha256(pass);
  const u = {id:uid(),username:username.toLowerCase().trim(),password_hash:hash,
    nome_completo:nome.trim(),ruolo:'admin',attivo:true,created_at:nowStr()};
  await db.insert('magazzino_utenti',u);
  state.utente = u; state.phase='app';
  await loadAll();
}

async function doLogin(username,pass){
  const utenti = await db.select('magazzino_utenti',`username=eq.${username.toLowerCase().trim()}`);
  const u = utenti[0];
  if(!u||!u.attivo) throw new Error('Utente non trovato o disabilitato.');
  const hash = await sha256(pass);
  if(hash!==u.password_hash) throw new Error('Password errata.');
  await db.insert('magazzino_log_accessi',{id:uid(),tipo:'login',utente:u.username,nome_completo:u.nome_completo,data:nowStr()});
  state.utente=u; state.phase='app'; state.mag=userMags(u)[0];
  await loadAll();
}

async function doLogout(){
  await db.insert('magazzino_log_accessi',{id:uid(),tipo:'logout',utente:state.utente.username,nome_completo:state.utente.nome_completo,data:nowStr()});
  state.utente=null; state.phase='login'; state.tab='Giacenze';
  render();
}

async function doCarico(m){
  const mov = {id:uid(),articolo_id:m.articoloId,tipo:'carico',quantita:m.quantita,
    causale:m.causale,scadenza:m.scadenza||null,note:m.note||null,
    is_scatola:m.isScatola||false,n_scatole:m.nScatole||null,
    utente:state.utente.username,nome_utente:state.utente.nome_completo,data:nowStr(),magazzino:curMag()};
  await db.insert('magazzino_movimenti',mov);
  await db.insert('magazzino_log_accessi',{id:uid(),tipo:'carico',utente:state.utente.username,
    nome_completo:state.utente.nome_completo,articolo_id:m.articoloId,
    quantita:m.quantita,causale:m.causale,data:nowStr(),magazzino:curMag()});
  await loadAll();
}

async function doScarico(m){
  const mov = {id:uid(),articolo_id:m.articoloId,tipo:'scarico',quantita:m.quantita,
    causale:m.causale,scadenza:m.scadenza||null,note:m.note||null,
    is_scatola:m.isScatola||false,n_scatole:m.nScatole||null,
    utente:state.utente.username,nome_utente:state.utente.nome_completo,data:nowStr(),magazzino:curMag()};
  await db.insert('magazzino_movimenti',mov);
  await db.insert('magazzino_log_accessi',{id:uid(),tipo:'scarico',utente:state.utente.username,
    nome_completo:state.utente.nome_completo,articolo_id:m.articoloId,
    quantita:m.quantita,causale:m.causale,data:nowStr(),magazzino:curMag()});
  await loadAll();
}

async function saveArticolo(art, isNew){
  const toInt = v => { const n=parseInt(v); return (!isNaN(n)&&n>0)?n:null; };
  const row = {
    id:            art.id||uid(),
    codice:        art.codice,
    barcode:       art.barcode||null,
    nome:          art.nome,
    um:            art.um,
    tipo_id:       art.tipo_id||null,
    frigo:         art.frigo===true||art.frigo==='true'||false,
    note:          (art.note&&String(art.note).trim())||null,
    flag:          FLAGS[art.flag]?art.flag:null,
    created_at:    art.created_at||nowStr()
  };
  if(isNew) await db.insert('magazzino_articoli',row);
  else { delete row.created_at; await db.update('magazzino_articoli',row,`id=eq.${row.id}`); }
  // Magazzini abilitati: inserisce/aggiorna quelli scelti, rimuove gli altri
  const mags=art.mags||[];
  if(mags.length) await db.upsert('magazzino_articoli_magazzini',mags.map(x=>({articolo_id:row.id,...x})),'articolo_id,magazzino');
  const off=MAGAZZINI.map(m=>m.id).filter(id=>!mags.some(x=>x.magazzino===id));
  if(off.length) await db.delete('magazzino_articoli_magazzini',`articolo_id=eq.${row.id}&magazzino=in.(${off.join(',')})`);
  await loadAll();
}

async function deleteArticolo(id){
  const img=state.articoli.find(a=>a.id===id)?.immagine_id;
  if(img) imgApi('elimina',{id:img}).catch(e=>console.warn('Immagine non eliminata:',e.message));
  await db.delete('magazzino_articoli_codici',`articolo_id=eq.${id}`).catch(()=>{});
  await db.delete('magazzino_movimenti',`articolo_id=eq.${id}`);
  await db.delete('magazzino_articoli',`id=eq.${id}`);
  await loadAll();
}

async function saveUtente(u, isNew){
  if(isNew) await db.insert('magazzino_utenti',{...u,id:uid(),attivo:true,created_at:nowStr()});
  else await db.update('magazzino_utenti',u,`id=eq.${u.id}`);
  await loadAll();
}

// ════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════
function showToast(msg,type='ok'){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  const mob=window.innerWidth<700;
  el.style.cssText=`position:fixed;bottom:${mob?80:24}px;right:${mob?12:24}px;background:${type==='ok'?'var(--verde)':'var(--rosso)'};color:#fff;font-weight:700;font-size:12px;padding:12px 20px;border-radius:8px;box-shadow:0 8px 32px #0000002a;z-index:9999;animation:slideUp .25s ease;max-width:calc(100vw - 24px);`;
  el.textContent=msg;
  clearTimeout(window._toastT);
  window._toastT=setTimeout(()=>{ el.remove(); },3000);
}

// ════════════════════════════════════════════════════════════════
// BARCODE SCANNER (lettore fisico)
// ════════════════════════════════════════════════════════════════
let _bcBuf='', _bcLast=0;
document.addEventListener('keydown', e=>{
  if(state.phase!=='app'||state.modal) return;
  const el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')) return;
  const now=Date.now();
  if(now-_bcLast>120) _bcBuf='';
  _bcLast=now;
  if(e.key==='Enter'&&_bcBuf.length>=3){
    const art=findArtByBarcode(_bcBuf.trim());
    if(art&&!isEnabled(art.id,state.mag)) showToast(`${art.codice} non è abilitato nel magazzino ${magNome(state.mag)}.`,'error');
    else if(art) openModal({type:'quick_scan',art});
    else showToast('Barcode non trovato: '+_bcBuf.trim(),'error');
    _bcBuf=''; return;
  }
  if(e.key.length===1) _bcBuf+=e.key;
});

function findArtByBarcode(code){
  return state.articoli.find(a=>
    a.codice.toLowerCase()===code.toLowerCase()||
    (a.barcode&&a.barcode.toLowerCase()===code.toLowerCase())
  );
}

// ════════════════════════════════════════════════════════════════
// MODAL MANAGER
// ════════════════════════════════════════════════════════════════
function openModal(m){
  const isMov=m.type==='carico'||m.type==='scarico'||m.type==='sposta';
  if(isMov){ window._movModalita='pezzi'; window._movCodici=[]; window._movCodSel=new Set(); }
  if(m.type==='codici_art'){ window._codStato='carico'; window._codQ=''; }
  if(m.type==='nuovo_art'||m.type==='edit_art'){ const cur=m.art?state.articoli.find(x=>x.id===m.art.id):null; window._artImg={file:null,preview:null,remove:false,currentId:cur?.immagine_id||null}; }
  state.modal=m; render();
  if(isMov&&m.preselectId&&document.getElementById('mov-art')?.value) movArtChange();
  if(isMov&&!document.getElementById('mov-art')?.value&&!state.isMobile){
    const q=document.getElementById('mov-art-q'); if(q) q.focus();
  }
}
function closeModal(){ state.modal=null; render(); }

// ════════════════════════════════════════════════════════════════
// RENDER ENGINE (vanilla DOM)
// ════════════════════════════════════════════════════════════════
function render(){
  const app = document.getElementById('app');
  if(state.phase==='loading'){ app.innerHTML=loadingHTML(); return; }
  if(state.phase==='setup'){   app.innerHTML=setupHTML();   bindSetup(); return; }
  if(state.phase==='login'){   app.innerHTML=loginHTML();   bindLogin(); return; }
  closeFlagPop();
  app.innerHTML=mainHTML();
  bindMain();
  if(state.modal?.type==='codici_art') updateCodModal(state.modal.id);
  if((state.modal?.type==='nuovo_art'||state.modal?.type==='edit_art')&&window._artImg) artImgRender();
  ensureImgUrls();
}

function bindSetup(){
  document.getElementById('setup-btn').onclick = async () => {
    const nome=val('setup-nome'),user=val('setup-user'),pass=val('setup-pass'),pass2=val('setup-pass2');
    const err=document.getElementById('setup-err');
    err.innerHTML='';
    if(!nome||!user||!pass){ err.innerHTML=errBox('Tutti i campi sono obbligatori.'); return; }
    if(pass.length<6){ err.innerHTML=errBox('Password minimo 6 caratteri.'); return; }
    if(pass!==pass2){ err.innerHTML=errBox('Le password non coincidono.'); return; }
    setLoading('setup-btn',true);
    try{ await doSetup(nome,user,pass); }
    catch(e){ err.innerHTML=errBox(e.message); setLoading('setup-btn',false); }
  };
}

// ── Login ─────────────────────────────────────────────────────
let _appVersion = '';

async function fetchVersion(){
  const GITHUB_REPO = 'ictmedicalgroup-sudo/magazzino';
  try {
    const r = await fetch(
      `https://api.github.com/repos/${GITHUB_REPO}/commits?per_page=1`,
      { headers: { 'Accept': 'application/vnd.github.v3+json' } }
    );
    if(!r.ok) return;
    const data = await r.json();
    if(!data.length) return;
    const date = new Date(data[0].commit.author.date);
    _appVersion = date.toLocaleString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    // Se siamo nella schermata di login, ridisegna per mostrare la versione
    if(state.phase === 'login') render();
  } catch {}
}

      <div id="login-logo" style="margin-bottom:0"></div>
      <div style="margin-top:14px;font-size:13px;color:var(--grigio);text-align:center">Accesso riservato al personale autorizzato</div>
      <div id="login-err" style="display:none;background:#FDECEA;color:#C0392B;border-radius:6px;padding:10px 14px;font-size:13px;margin-top:14px;"></div>
      <div style="margin-top:12px;margin-bottom:16px">
        <label style="display:block;font-size:12px;font-weight:600;color:#4A4C4D;letter-spacing:.5px;margin-bottom:6px">E-Mail</label>
        <input id="login-user" type="email" placeholder="nome@medicalgroup.it" autocomplete="username"
          style="width:100%;padding:10px 10px;border:1px solid #E2E6DF;border-radius:6px;background:#EEF5E3;font-family:'Raleway',sans-serif;font-size:14px;color:#2A2C2D;outline:none;transition:border-color .2s"/>
      </div>

          style="width:100%;padding:10px 10px;border:1px solid #E2E6DF;border-radius:6px;background:#EEF5E3;font-family:'Raleway',sans-serif;font-size:14px;color:#2A2C2D;outline:none;transition:border-color .2s"/>
      </div>
      <button id="login-btn" style="width:100%;padding:12px;background:#9DBF60;color:#fff;border:none;border-radius:6px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s">Accedi</button>
      <div style="margin-top:14px;font-size:10px;color:#aaaaaa;text-align:center;letter-spacing:.5px">${_appVersion?"build "+_appVersion:""}</div>
    </div>

function bindLogin(){
  const ll=document.getElementById('login-logo');
  if(ll) ll.innerHTML=logoHTML(false);
  const go = async () => {
    const err=document.getElementById('login-err');
    err.style.display='none'; err.textContent='';
    const btn=document.getElementById('login-btn');
    btn.disabled=true; btn.textContent='Accesso…';
    try{ await doLogin(val('login-user'),val('login-pass')); }
    catch(e){ err.textContent=e.message; err.style.display='block'; btn.disabled=false; btn.textContent='Accedi'; }
  };
  document.getElementById('login-btn').onclick=go;
  document.getElementById('login-user').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('login-pass').focus(); });
  document.getElementById('login-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

      <div style="font-size:9px;color:var(--grigio);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">${s.label}</div>
      <div style="font-size:24px;font-weight:700;line-height:1;">${s.val}</div>

      <div>
        <div style="font-weight:700;color:var(--rosso);font-size:13px;margin-bottom:4px;">Articoli sotto scorta minima · ${magNome(state.mag)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--grigio-scuro);">
          ${alertList.map(g=>`<span><b>${g.art.codice}</b> ${g.art.nome}: <span style="color:var(--rosso);font-weight:700;">${fmt(g.pezzi)} ${g.art.um}</span><span style="color:var(--grigio-chiaro);"> / min.${fmt(g.art.scorta_min)}</span></span>`).join('')}
        </div>
      </div>

  const modalHTML = state.modal ? renderModal(giacenze) : '';

  const fabHTML = mob ? `

      ${userMags().length>1?`<button onclick="apriSposta()" title="Sposta tra magazzini" style="width:44px;height:44px;border-radius:50%;background:#fff;color:var(--grigio-scuro);border:1px solid var(--bordo);font-size:18px;cursor:pointer;box-shadow:0 4px 16px #0000001a;align-self:center;">⇄</button>`:''}

      <button onclick="openModal({type:'carico',preselectId:null})"  style="width:52px;height:52px;border-radius:50%;background:var(--verde);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px #9DBF6044;">+</button>

              ${!mob?`<span style="font-size:11px;color:var(--grigio);font-weight:600;">${state.utente?.nome_completo}</span>`:''}

function renderGiacenze(giacenze,alertList){
  const search=(window._giacSearch||'').toLowerCase();
  const filtro=window._giacFiltro||'tutti';
  const rows=Object.values(giacenze).filter(g=>{
    const m=!search||g.art.codice.toLowerCase().includes(search)||g.art.nome.toLowerCase().includes(search)||(g.art.barcode&&g.art.barcode.toLowerCase().includes(search));
    const sotto=scortaAttiva(g.art)&&g.pezzi<g.art.scorta_min;
    if(filtro==='alert'&&!sotto) return false;
    if(filtro==='ok'&&sotto)     return false;
    if(!filtroArtOk(g.art,'giac')) return false;
    return m;
  });

  const pillFiltro=(v,l)=>{
    const bg=filtro===v?'var(--verde)':'#fff';
    const cl=filtro===v?'#fff':'var(--grigio)';
    const bd=filtro===v?'var(--verde)':'var(--bordo)';
    return `<button onclick="window._giacFiltro='${v}';updateGiacenzeTable();" style="padding:7px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:${bg};color:${cl};border:1px solid ${bd};">${l}</button>`;
  };

  const rowsHTML = state.isMobile
    ? rows.map(g=>mobileGiacenzaCard(g)).join('')
    : `<div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
            ${['','Codice / Barcode','Descrizione','U.M.','Giacenza','Pz/Sc','Scorta min.','Stato',''].map(h=>`<th style="text-align:left;padding:10px 10px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;">${h}</th>`).join('')}
          </tr></thead>
          <tbody>${rows.map(g=>desktopGiacenzaRow(g)).join('')}</tbody>
        </table>
      </div>`;

  return `
    <div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">
        <input id="giac-search" value="${window._giacSearch||''}" placeholder="🔍  Cerca per codice, barcode o nome…"
          oninput="window._giacSearch=this.value;updateGiacenzeTable();"
          style="${inpStyle()};flex:1;min-width:200px;max-width:300px;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${pillFiltro('tutti','Tutti')}${pillFiltro('alert','⚠ Alert')}${pillFiltro('ok','✓ OK')}
        </div>
        ${filtriHTML('giac','updateGiacenzeTable();')}
        <button onclick="exportGiacenze()" style="${btnStyle('ghost',true)};margin-left:auto;">⬇ CSV</button>
      </div>
      <div id="giac-table-wrap">${rows.length===0?'<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun articolo trovato.</div>':rowsHTML}</div>
    </div>`;
}

function mobileGiacenzaCard(g){
  const sotto=scortaAttiva(g.art)&&g.pezzi<g.art.scorta_min;
  return `<div style="background:${flagBg(g.art)};border:1px solid ${sotto?'var(--rosso)':'var(--bordo)'};border-radius:10px;padding:14px 16px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div><span style="display:inline-flex;align-items:center;gap:8px;">${flagDot(g.art)}${pill(g.art.codice,'var(--grigio)')}</span><div style="display:flex;align-items:center;gap:10px;margin-top:6px;">${thumbHTML(g.art,44)}<div style="font-weight:600;font-size:14px;">${g.art.nome}${artBadges(g.art)}</div></div></div>
      <div style="text-align:right;"><div style="font-weight:700;font-size:22px;color:${sotto?'var(--rosso)':g.pezzi<=0?'var(--grigio-chiaro)':'var(--testo)'}">${fmt(g.pezzi)}</div><div style="font-size:11px;color:var(--grigio);">${g.art.um}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
      <div>${scortaAttiva(g.art)?(sotto?pill('⚠ Sotto scorta','var(--rosso)'):pill('✓ OK','var(--verde)')):''}</div>
      <div style="display:flex;gap:8px;">
        ${codiciBtn(g.art)}${noteBtn(g.art)}
        <button onclick="openModal({type:'carico',preselectId:'${g.art.id}'})" style="${btnStyle('outline',true)}">↑</button>
        <button onclick="openModal({type:'scarico',preselectId:'${g.art.id}'})" style="${btnStyle('ghost',true)}">↓</button>
      </div>
    </div>
  </div>`;
}

function desktopGiacenzaRow(g){
  const sotto=scortaAttiva(g.art)&&g.pezzi<g.art.scorta_min;
  const pzSc=g.art.pezzi_scatola&&g.pezzi>0?`<span style="color:var(--grigio-chiaro);font-size:10px;margin-left:6px;">(${Math.floor(g.pezzi/g.art.pezzi_scatola)}sc+${g.pezzi%g.art.pezzi_scatola})</span>`:'';
  return `<tr ${rowAttrs(g.art)}>
    ${flagCell(g.art)}
    <td style="padding:10px 10px;white-space:nowrap;">${pill(g.art.codice,'var(--grigio)')}${g.art.barcode?`<div style="font-size:10px;color:var(--grigio-chiaro);font-family:monospace;margin-top:5px;padding-left:9px;">${g.art.barcode}</div>`:''}</td>
    <td style="padding:10px 10px;font-weight:600;"><div style="display:flex;align-items:center;gap:10px;">${thumbHTML(g.art)}<div>${g.art.nome}${artBadges(g.art)}</div></div></td>
    <td style="padding:10px 10px;color:var(--grigio);">${g.art.um}</td>
    <td style="padding:10px 10px;"><span style="font-weight:700;font-size:15px;color:${sotto?'var(--rosso)':g.pezzi<=0?'var(--grigio-chiaro)':'var(--testo)'}">${fmt(g.pezzi)}</span>${pzSc}</td>
    <td style="padding:10px 10px;color:var(--grigio);">${g.art.pezzi_scatola||'—'}</td>
    <td style="padding:10px 10px;color:var(--grigio);">${scortaAttiva(g.art)?fmt(g.art.scorta_min):'—'}</td>
    <td style="padding:10px 10px;">${!scortaAttiva(g.art)?'<span style="color:var(--grigio-chiaro);font-size:11px;">—</span>':sotto?pill('⚠ Sotto scorta','var(--rosso)'):pill('✓ OK','var(--verde)')}</td>
    <td style="padding:10px 10px;"><div style="display:flex;gap:6px;justify-content:flex-end;white-space:nowrap;">
      ${codiciBtn(g.art)}${noteBtn(g.art)}
      <button onclick="openModal({type:'carico',preselectId:'${g.art.id}'})" style="${btnStyle('outline',true)}">↑</button>
      <button onclick="openModal({type:'scarico',preselectId:'${g.art.id}'})" style="${btnStyle('ghost',true)}">↓</button>
    </div></td>
  </tr>`;
}

function updateGiacenzeTable(){
  setTimeout(ensureImgUrls,0);
  const giacenze=calcGiacenze();
  const search=(window._giacSearch||'').toLowerCase();
  const filtro=window._giacFiltro||'tutti';
  const rows=Object.values(giacenze).filter(g=>{
    const m=!search||g.art.codice.toLowerCase().includes(search)||g.art.nome.toLowerCase().includes(search)||(g.art.barcode&&g.art.barcode.toLowerCase().includes(search));
    const sotto=scortaAttiva(g.art)&&g.pezzi<g.art.scorta_min;
    if(filtro==='alert'&&!sotto) return false;
    if(filtro==='ok'&&sotto) return false;
    if(!filtroArtOk(g.art,'giac')) return false;
    return m;
  });
  const wrap=document.getElementById('giac-table-wrap');
  if(!wrap){ render(); return; }
  if(rows.length===0){
    wrap.innerHTML='<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun articolo trovato.</div>';
    return;
  }
  if(window.innerWidth<700){
    wrap.innerHTML=rows.map(g=>mobileGiacenzaCard(g)).join('');
  } else {
    wrap.innerHTML=`<div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
          ${['','Codice / Barcode','Descrizione','U.M.','Giacenza','Pz/Sc','Scorta min.','Stato',''].map(h=>`<th style="text-align:left;padding:10px 10px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.map(g=>desktopGiacenzaRow(g)).join('')}</tbody>
      </table>
    </div>`;
  }
}

function exportGiacenze(){
  const giacenze=calcGiacenze();
  exportCSV(Object.values(giacenze).map(g=>({
    codice:g.art.codice,nome:g.art.nome,barcode:g.art.barcode||'',um:g.art.um,
    pezzi:g.pezzi,pz_sc:g.art.pezzi_scatola||'',scorta_min:g.art.scorta_min||'',
    stato:scortaAttiva(g.art)&&g.pezzi<g.art.scorta_min?'SOTTO SCORTA':'Regolare'
  })),[
    {key:'codice',label:'Codice'},{key:'nome',label:'Descrizione'},{key:'barcode',label:'Barcode'},
    {key:'um',label:'U.M.'},{key:'pezzi',label:'Giacenza'},{key:'pz_sc',label:'Pz/Sc'},
    {key:'scorta_min',label:'Scorta min.'},{key:'stato',label:'Stato'}
  ],`giacenze_${state.mag}.csv`);
}

function renderMovimenti(){
  const search=(window._movSearch||'').toLowerCase();
  const filtroT=window._movFiltro||'';
  const artMap=Object.fromEntries(state.articoli.map(a=>[a.id,a]));
  const rows=state.movimenti.filter(m=>{
    if(movMag(m)!==state.mag) return false;
    const a=artMap[m.articolo_id];
    const match=!search||a?.codice?.toLowerCase().includes(search)||a?.nome?.toLowerCase().includes(search)||m.causale?.toLowerCase().includes(search)||m.nome_utente?.toLowerCase().includes(search);
    return match&&(!filtroT||m.tipo===filtroT)&&filtroArtOk(a,'mov');
  });
  const rowsHTML = state.isMobile
    ? rows.map(m=>{ const a=artMap[m.articolo_id]; return `
        <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:12px 14px;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            ${pill(m.tipo,m.tipo==='carico'?'var(--verde)':'var(--rosso)')}
            <span style="font-size:11px;color:var(--grigio);">${m.data}</span>
          </div>
          <div style="font-weight:600;font-size:13px;">${a?.nome||'?'}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
            <span style="font-weight:700;font-size:16px;color:${m.tipo==='carico'?'var(--verde-scuro)':'var(--rosso)'};">${m.tipo==='carico'?'+':'−'}${fmt(m.quantita)} ${a?.um||''}</span>
            <span style="font-size:11px;color:var(--grigio);">${m.nome_utente||m.utente||''}</span>
          </div>

function renderScadenze(){
  const artMap=Object.fromEntries(state.articoli.map(a=>[a.id,a]));
  const today=new Date(); today.setHours(0,0,0,0);

  // Calcola giacenza netta per ogni (articolo, scadenza)
  const lotti={}; // key: "artId|YYYY-MM-DD"
  state.movimenti.forEach(m=>{
    if(!m.scadenza||!artMap[m.articolo_id]||movMag(m)!==state.mag) return;
    const k=m.articolo_id+'|'+m.scadenza;
    if(!lotti[k]) lotti[k]={artId:m.articolo_id,scadenza:m.scadenza,pezzi:0};
    lotti[k].pezzi+=m.tipo==='carico'?m.quantita:-m.quantita;
  });

  // Mantieni solo lotti con giacenza positiva, ordina per data scadenza
  const righe=Object.values(lotti)
    .filter(l=>l.pezzi>0&&filtroArtOk(artMap[l.artId],'scad'))
    .map(l=>({...l,art:artMap[l.artId]}))
    .sort((a,b)=>a.scadenza.localeCompare(b.scadenza));

  const barScad=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">
      ${filtriHTML('scad','render();')}
      <span style="font-size:11px;color:var(--grigio);margin-left:auto;">${righe.length} lotti disponibili · ordinati per data di scadenza</span>
    </div>`;
  if(!righe.length) return barScad+'<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">'+(filtriAttivi('scad')?'Nessuna scadenza per i filtri selezionati.':'Nessuna scadenza con giacenza disponibile.')+'</div>';

  // Raggruppa per data scadenza
  const gruppi={};
  righe.forEach(r=>{ if(!gruppi[r.scadenza]) gruppi[r.scadenza]=[]; gruppi[r.scadenza].push(r); });

  const statoSc=iso=>{
    if(isNoScad(iso)) return {label:'NO SCADENZA', color:'var(--grigio)', bg:'var(--grigio-sfondo)'};
    const d=new Date(iso); d.setHours(0,0,0,0);
    const diff=Math.round((d-today)/86400000);
    if(diff<0)   return {label:'SCADUTO',        color:'var(--rosso)',  bg:'var(--rosso-chiaro)'};
    if(diff<=30) return {label:`tra ${diff} gg`, color:'var(--arancio)',bg:'var(--arancio-chiaro)'};
    return              {label:`tra ${diff} gg`, color:'var(--verde)',  bg:'var(--verde-pale)'};
  };

  // Unica tabella con colonna "Scadenza" — colonne perfettamente allineate tra i gruppi
  const thStyle = 'text-align:left;padding:10px 10px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;';
  const allRows = righe.map(l => {
    const s = statoSc(l.scadenza);
    return `
      <tr style="border-bottom:1px solid var(--bordo);background:${s.label==='SCADUTO'?'var(--rosso-chiaro)':'transparent'};"
        onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
        <td style="padding:10px 14px;white-space:nowrap;">
          <div style="font-weight:700;font-size:13px;">${isNoScad(l.scadenza)?'Senza scadenza':fmtData(l.scadenza)}</div>
          <div style="margin-top:3px;display:inline-block;background:${s.bg};color:${s.color};border:1px solid ${s.color}44;border-radius:20px;font-size:9px;font-weight:700;padding:1px 8px;letter-spacing:.8px;">${s.label}</div>
        </td>
        <td style="padding:10px 14px;">${pill(l.art.codice,'var(--grigio)')}</td>
        <td style="padding:10px 14px;font-weight:600;">${l.art.nome}</td>
        <td style="padding:10px 14px;color:var(--grigio);">${l.art.um}</td>
        <td style="padding:10px 14px;font-weight:700;font-size:15px;color:${s.label==='SCADUTO'?'var(--rosso)':'var(--testo)'};">${fmt(l.pezzi)}</td>
      </tr>`;
  }).join('');

  return `<div>
    ${barScad}
    <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="border-bottom:2px solid var(--bordo);background:var(--grigio-sfondo);">
            <th style="${thStyle}">Scadenza</th>
            <th style="${thStyle}">Codice</th>
            <th style="${thStyle}">Descrizione</th>
            <th style="${thStyle}">U.M.</th>
            <th style="${thStyle}">Qtà disponibile</th>
          </tr>
        </thead>
        <tbody>${allRows}</tbody>
      </table>
    </div>
  </div>`;
}

  const parseD=str=>{ if(!str) return null; const [dp]=str.split(','); const [d,m,y]=dp.trim().split('/'); return new Date(`${y}-${m}-${d}`); };
  const dalD=dal?new Date(dal):null;
  const alD =al ?new Date(al) :null; if(alD) alD.setHours(23,59,59);

function updateLogTable(){
  // Aggiorna solo il contenuto del log senza ricostruire i filtri (preserva il focus)
  const LABEL={login:'Login',logout:'Logout',carico:'Carico',scarico:'Scarico',crea_utente:'Nuovo utente',reset_password:'Reset password',sposta:'Spostamento'};
  const COLOR={login:'var(--verde)',logout:'var(--grigio)',carico:'var(--verde)',scarico:'var(--rosso)',crea_utente:'var(--arancio)',reset_password:'var(--arancio)',sposta:'#3E9E9A'};
  const PER_PAG=10;
  const search=(window._logSearch||'').toLowerCase();
  const dal=window._logDal||''; const al=window._logAl||'';
  const parseD=str=>{ if(!str) return null; const [dp]=str.split(','); const [d,m,y]=dp.trim().split('/'); return new Date(`${y}-${m}-${d}`); };
  const dalD=dal?new Date(dal):null;
  const alD=al?new Date(al):null; if(alD) alD.setHours(23,59,59);
  const filtered=state.logEntries.filter(e=>{
    const q=search;
    const m=!q||e.nome_completo?.toLowerCase().includes(q)||e.utente?.toLowerCase().includes(q)||(LABEL[e.tipo]||e.tipo).toLowerCase().includes(q);
    const d=parseD(e.data);
    return m&&(!dalD||!d||d>=dalD)&&(!alD||!d||d<=alD);
  });
  const totP=Math.max(1,Math.ceil(filtered.length/PER_PAG));
  const pag=Math.min(window._logPag||1,totP);
  const rows=filtered.slice((pag-1)*PER_PAG,pag*PER_PAG);

  // Aggiorna contatore
  const counter=document.getElementById('log-counter');
  if(counter) counter.textContent=`${filtered.length} risultati — pagina ${pag} di ${totP}`;

  // Aggiorna tabella
  const wrap=document.getElementById('log-table-wrap');
  if(!wrap){ render(); return; }

  const pagBtn=(p,label,dis)=>`<button onclick="window._logPag=${p};updateLogTable();" ${dis?'disabled':''} style="padding:6px 10px;border-radius:6px;border:1px solid var(--bordo);background:transparent;color:${dis?'var(--grigio-chiaro)':'var(--grigio)'};cursor:${dis?'not-allowed':'pointer'};font-family:inherit;font-size:12px;">${label}</button>`;
  const pageNums=Array.from({length:totP},(_,i)=>i+1)
    .filter(p=>p===1||p===totP||Math.abs(p-pag)<=1)
    .reduce((acc,p,i,arr)=>{ if(i>0&&p-arr[i-1]>1) acc.push('…'); acc.push(p); return acc; },[])
    .map(p=>p==='…'?`<span style="color:var(--grigio);padding:0 4px;">…</span>`
      :`<button onclick="window._logPag=${p};updateLogTable();" style="width:32px;height:32px;border-radius:6px;border:1px solid ${p===pag?'var(--verde)':'var(--bordo)'};background:${p===pag?'var(--verde)':'transparent'};color:${p===pag?'#fff':'var(--grigio)'};cursor:pointer;font-family:inherit;font-weight:600;font-size:12px;">${p}</button>`
    ).join('');

  if(rows.length===0){
    wrap.innerHTML='<div style="text-align:center;color:var(--grigio-chiaro);padding:60px 0;font-size:13px;">Nessun accesso registrato per i criteri selezionati.</div>';
    return;
  }
  wrap.innerHTML=`
    <div style="background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:auto;box-shadow:0 1px 4px #0000000a;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="border-bottom:1px solid var(--bordo);background:var(--grigio-sfondo);">
          ${['Data/Ora','Utente','Tipo','Dettaglio'].map(h=>`<th style="text-align:left;padding:10px 10px;font-weight:700;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.8px;">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.map(e=>`
          <tr onmouseover="this.style.background='var(--verde-pale)'" onmouseout="this.style.background='transparent'" style="border-bottom:1px solid var(--bordo);">
            <td style="padding:10px 14px;color:var(--grigio);font-size:11px;white-space:nowrap;">${e.data}</td>
            <td style="padding:10px 14px;"><div style="font-weight:600;font-size:13px;">${e.nome_completo||'—'}</div><div style="font-size:11px;color:var(--grigio);">@${e.utente||''}</div></td>
            <td style="padding:10px 14px;">${pill(LABEL[e.tipo]||e.tipo,COLOR[e.tipo]||'var(--grigio)')}</td>
            <td style="padding:10px 14px;color:var(--grigio);font-size:12px;">${logDettaglio(e)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${totP>1?`<div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;">${pagBtn(1,'«',pag<=1)}${pagBtn(pag-1,'‹',pag<=1)}${pageNums}${pagBtn(pag+1,'›',pag>=totP)}${pagBtn(totP,'»',pag>=totP)}</div>`:''}`;
}

function exportLog(){
  const LABEL={login:'Login',logout:'Logout',carico:'Carico',scarico:'Scarico',crea_utente:'Nuovo utente',reset_password:'Reset password',sposta:'Spostamento'};
  exportCSV(state.logEntries.map(e=>({data:e.data,utente:e.nome_completo||e.utente,tipo:LABEL[e.tipo]||e.tipo,dettaglio:(e.magazzino?magNome(e.magazzino)+' · ':'')+(e.causale||e.target_user||'')})),

function renderModal(giacenze){
  const m=state.modal;
  let html='';
  if(m.type==='quick_scan') html=quickScanModal(m.art,giacenze);
  else if(m.type==='carico'||m.type==='scarico'||m.type==='sposta') html=movimentoModal(m.type,m.preselectId,giacenze);
  else if(m.type==='nuovo_tipo') html=tipoModal(null);

  else if(m.type==='nuovo_art'||m.type==='edit_art') html=articoloModal(m.art);

// Giacenza per lotto: { 'YYYY-MM-DD': pezzi_disponibili }
function calcLottiPerArticolo(articoloId,mag=curMag()){
  const lotti={};
  state.movimenti.forEach(m=>{
    if(m.articolo_id!==articoloId||!m.scadenza||movMag(m)!==mag) return;
    if(!lotti[m.scadenza]) lotti[m.scadenza]=0;
    lotti[m.scadenza]+= m.tipo==='carico'?m.quantita:-m.quantita;
  });
  // Rimuovi lotti esauriti o negativi
  Object.keys(lotti).forEach(k=>{ if(lotti[k]<=0) delete lotti[k]; });
  return lotti;
}

// Costruisce la select delle scadenze disponibili per un articolo (scarico)
function buildScadenzaSelect(artId){
  const lotti=calcLottiPerArticolo(artId);
  const art=artById(artId);
  const sorted=Object.entries(lotti).sort(([a],[b])=>a.localeCompare(b));
  if(!sorted.length){
    return `<select id="mov-scad" disabled style="${inpStyle()};opacity:.5;"><option>Nessun lotto disponibile</option></select>`;
  }
  const opts=sorted.map(([data,pz])=>`<option value="${data}">${isNoScad(data)?'Senza scadenza':fmtData(data)} — disponibili: ${fmt(pz)} ${art?.um||''}</option>`).join('');
  return `<select id="mov-scad" onchange="movScadChange('${artId}')" style="${inpStyle()}"><option value="">— seleziona lotto —</option>${opts}</select>`;
}

// Aggiorna info lotto e verifica quantità quando si sceglie la scadenza
function movScadChange(artId){
  const noScad=document.getElementById('cb-no-scad')?.checked||false;
  const scad=noScad?NO_SCAD_ISO:(document.getElementById('mov-scad')?.value||'');
  if(!scad){ document.getElementById('mov-lotto-info').innerHTML=''; return; }
  const lotti=calcLottiPerArticolo(artId);
  const art=artById(artId);
  const disp=lotti[scad]??0;

  document.getElementById('mov-lotto-info').innerHTML=`
    <div style="background:var(--verde-pale);border:1px solid var(--verde-chiaro);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--grigio-scuro);">

// Controlla quantità scarico vs disponibilità lotto e blocca il pulsante
function checkQtyScarico(){
  const noScad=document.getElementById('cb-no-scad')?.checked||false;
  const scad=noScad?NO_SCAD_ISO:(document.getElementById('mov-scad')?.value||'');
  const artId=document.getElementById('mov-art')?.value;
  const qtyEl=document.getElementById('mov-qty');
  const btn=document.getElementById('mov-submit-btn');
  const errEl=document.getElementById('mov-err');
  if(!scad||!artId||!qtyEl||!btn) return;
  const lotti=calcLottiPerArticolo(artId);
  const disp=lotti[scad]??0;
  const art=artById(artId);
  const qty=parseInt(qtyEl.value)||0;
  if(qty>disp&&qty>0){
    qtyEl.style.borderColor='var(--rosso)';

    btn.style.opacity='0.45';
    btn.style.cursor='not-allowed';
  } else {
    qtyEl.style.borderColor='var(--bordo)';
    qtyEl.style.boxShadow='none';
    errEl.innerHTML='';
    btn.disabled=false;
    btn.style.opacity='1';
    btn.style.cursor='pointer';
  }
}

// ── Combobox articolo (ricerca unica: codice, barcode, descrizione) ──
let _comboIdx=-1, _comboRes=[];
function comboSearch(q){
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length) return comboPool().sort((a,b)=>a.codice.localeCompare(b.codice));
  const ql=q.trim().toLowerCase();
  return comboPool()
    .filter(a=>{ const hay=(a.codice+' '+(a.barcode||'')+' '+a.nome).toLowerCase(); return words.every(w=>hay.includes(w)); })
    .sort((a,b)=>{
      const sc=x=>(x.codice.toLowerCase()===ql||(x.barcode||'').toLowerCase()===ql)?0:x.codice.toLowerCase().startsWith(ql)?1:x.nome.toLowerCase().startsWith(ql)?2:3;
      return sc(a)-sc(b)||a.codice.localeCompare(b.codice);
    });
}
function comboHighlight(text,words){
  const t=String(text??''), tl=t.toLowerCase(), mark=new Array(t.length).fill(false);
  words.forEach(w=>{ if(!w) return; let i=tl.indexOf(w); while(i!==-1){ for(let k=i;k<i+w.length;k++) mark[k]=true; i=tl.indexOf(w,i+w.length); } });
  let out='', on=false;
  for(let i=0;i<t.length;i++){
    if(mark[i]&&!on){ out+='<b style="color:var(--verde-scuro);">'; on=true; }
    if(!mark[i]&&on){ out+='</b>'; on=false; }
    out+=escHtml(t[i]);
  }
  return out+(on?'</b>':'');
}
function comboRender(q){
  const list=document.getElementById('mov-art-list'); if(!list) return;
  _comboRes=comboSearch(q);
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const g=calcGiacenze(curMag());
  if(!_comboRes.length){
    list.innerHTML='<div style="padding:12px 14px;font-size:12px;color:var(--grigio-chiaro);font-weight:400;">Nessun articolo trovato.</div>';
  } else {
    const shown=_comboRes.slice(0,80);
    list.innerHTML=shown.map((a,i)=>`<div data-i="${i}" onmousedown="event.preventDefault();comboPick(${i});" onmousemove="comboSetIdx(${i})"
      style="padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--bordo);background:${i===_comboIdx?'var(--verde-pale)':'#fff'};">
      <div style="min-width:0;">
        <div style="font-size:13px;font-weight:600;color:var(--testo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${comboHighlight(a.nome,words)}${a.frigo?' <span style="font-size:11px;">❄</span>':''}</div>
        <div style="font-size:11px;color:var(--grigio);font-weight:400;">${comboHighlight(a.codice,words)}${a.barcode?' · <span style="font-family:monospace;">'+comboHighlight(a.barcode,words)+'</span>':''}</div>
      </div>
      <div style="font-size:11px;color:var(--grigio);white-space:nowrap;font-weight:400;">${fmt(g[a.id]?.pezzi??0)} ${escHtml(a.um)}</div>
    </div>`).join('')+(_comboRes.length>80?`<div style="padding:8px 14px;font-size:11px;color:var(--grigio-chiaro);font-weight:400;">…altri ${_comboRes.length-80}, affina la ricerca</div>`:'');
  }
  list.style.display='block';
}
function comboSetIdx(i){
  if(i===_comboIdx) return;
  const list=document.getElementById('mov-art-list'); if(!list) return;
  const prev=list.querySelector(`[data-i="${_comboIdx}"]`); if(prev) prev.style.background='#fff';
  _comboIdx=i;
  const cur=list.querySelector(`[data-i="${i}"]`); if(cur){ cur.style.background='var(--verde-pale)'; cur.scrollIntoView({block:'nearest'}); }
}
function comboOpen(){
  const q=document.getElementById('mov-art-q'); if(!q) return;
  // Articolo già selezionato: seleziona il testo per sostituirlo, senza aprire la tendina
  if(document.getElementById('mov-art').value){ q.select(); return; }
  // La tendina compare solo se c'è già del testo digitato
  _comboIdx=-1;
  if(q.value.trim()) comboRender(q.value); else comboClose();
}
function comboClose(){ const l=document.getElementById('mov-art-list'); if(l) l.style.display='none'; }
function comboInput(v){
  const hid=document.getElementById('mov-art');
  if(hid.value){ hid.value=''; movArtReset(); }
  document.getElementById('mov-art-x').style.display=v?'block':'none';
  // match esatto su barcode (lettore senza Invio) → selezione immediata
  const vl=v.trim().toLowerCase();
  const exact=vl.length>=6&&comboPool().find(a=>a.barcode&&a.barcode.toLowerCase()===vl);
  if(exact){ comboSelect(exact); return; }
  _comboIdx=-1;
  if(!v.trim()){ comboClose(); return; }
  comboRender(v);
  if(_comboRes.length===1) comboSetIdx(0);
}
function comboKey(e){
  const list=document.getElementById('mov-art-list');
  const open=list&&list.style.display!=='none';
  if(e.key==='ArrowDown'){ e.preventDefault(); if(!open) comboRender(e.target.value); comboSetIdx(Math.min(_comboIdx+1,Math.min(_comboRes.length,80)-1)); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); comboSetIdx(Math.max(_comboIdx-1,0)); }
  else if(e.key==='Enter'){
    e.preventDefault();
    const vl=e.target.value.trim().toLowerCase();
    const exact=comboPool().find(a=>a.codice.toLowerCase()===vl||(a.barcode&&a.barcode.toLowerCase()===vl));
    if(exact) comboSelect(exact);
    else if(_comboIdx>=0&&_comboRes[_comboIdx]) comboSelect(_comboRes[_comboIdx]);
    else if(_comboRes.length===1) comboSelect(_comboRes[0]);
    else if(_comboRes.length>1){ if(!open) comboRender(e.target.value); comboSetIdx(0); }
  }
  else if(e.key==='Escape'){ comboClose(); }
}
function comboPick(i){ if(_comboRes[i]) comboSelect(_comboRes[i]); }
function comboSelect(a){
  document.getElementById('mov-art').value=a.id;
  const q=document.getElementById('mov-art-q'); q.value=a.codice+' — '+a.nome;
  document.getElementById('mov-art-x').style.display='block';
  comboClose(); movArtChange();
  const next=document.getElementById('cod-in')||document.getElementById('cod-q')||document.getElementById('mov-qty'); if(next) next.focus();
}
function comboClear(){
  document.getElementById('mov-art').value='';
  const q=document.getElementById('mov-art-q'); q.value='';
  document.getElementById('mov-art-x').style.display='none';
  movArtReset(); q.focus();
}

async function submitMovimento(tipo){
  const errEl=document.getElementById('mov-err'); errEl.innerHTML='';
  if(tipo==='sposta') return submitSposta();
  const artId=document.getElementById('mov-art')?.value;
  const art=artById(artId);
  const qtyEl=document.getElementById('mov-qty');
  const noScad=document.getElementById('cb-no-scad')?.checked||false;
  const scad=noScad?NO_SCAD_ISO:(document.getElementById('mov-scad')?.value||'');
  const causale=document.getElementById('mov-causale')?.value;
  const note=document.getElementById('mov-note')?.value;
  if(!artId){ errEl.innerHTML=errBox('Seleziona un articolo.'); return; }
  if(isSerial(art)) return submitMovimentoSerial(tipo,art);
  const modalita=window._movModalita||'pezzi';
  let qty=parseInt(qtyEl?.value)||0;
  if(modalita==='scatole') qty=qty*(art?.pezzi_scatola||0);
  if(qty<=0){ errEl.innerHTML=errBox('Inserisci una quantità valida.'); return; }
  if(!scad){ errEl.innerHTML=errBox('Inserisci la data di scadenza.'); return; }
  if(tipo==='scarico'){
    const lotti=calcLottiPerArticolo(artId);
    const dispLotto=lotti[scad]??0;
    if(qty>dispLotto){ errEl.innerHTML=errBox(`Quantità superiore alla disponibilità del lotto: max ${fmt(dispLotto)} ${art?.um||''}.`); return; }
  }
  const btn=document.querySelector('#mov-form button:last-child');
  if(btn){ btn.innerHTML='<span class="spinner"></span>Salvataggio…'; btn.disabled=true; }
  try{
    const fn=tipo==='carico'?doCarico:doScarico;
    await fn({articoloId:artId,quantita:qty,causale,scadenza:scad,note,
      isScatola:modalita==='scatole',nScatole:modalita==='scatole'?parseInt(qtyEl?.value):null});
    closeModal(); showToast(`${tipo==='carico'?'Carico':'Scarico'} registrato.`);
    window._movModalita='pezzi';
  } catch(e){ errEl.innerHTML=errBox(e.message); if(btn){btn.innerHTML=`Conferma ${tipo}`;btn.disabled=false;} }
}

// ════════════════════════════════════════════════════════════════
// MAGAZZINI (Chirurgia / Ambulatorio)
// ════════════════════════════════════════════════════════════════
const MAGAZZINI = [
  {id:'chirurgia',   nome:'Chirurgia',   color:'#9DBF60', bg:'#eef4e3'},
  {id:'ambulatorio', nome:'Ambulatorio', color:'#3E9E9A', bg:'#e3f2f1'},
];
const CAUSALE_INVIO     = 'Invio ad altro magazzino';
const CAUSALE_RICEZIONE = 'Ricezione da altro magazzino';
const magInfo = id => MAGAZZINI.find(m=>m.id===id) || MAGAZZINI[0];
const magNome = id => magInfo(id).nome;
const movMag  = m  => m.magazzino || 'chirurgia';       // righe precedenti alla migrazione
const codMag  = c  => c.magazzino || 'chirurgia';
const tipoMags = t => (Array.isArray(t?.magazzini) && t.magazzini.length) ? t.magazzini : ['chirurgia'];

// Magazzini accessibili all'utente collegato (gli amministratori li vedono tutti)
function userMags(u=state.utente){
  if(!u) return [];
  if(u.ruolo==='admin') return MAGAZZINI.map(m=>m.id);
  const l=(Array.isArray(u.magazzini)&&u.magazzini.length?u.magazzini:['chirurgia']).filter(id=>MAGAZZINI.some(m=>m.id===id));
  return l.length?l:['chirurgia'];
}
function ensureMag(){
  const l=userMags();
  if(!l.includes(state.mag)) state.mag=l[0]||'chirurgia';
}
// Magazzino su cui lavora la modale aperta (per lo spostamento è quello di partenza)
function curMag(){ return state.modal?.type==='sposta' ? state.modal.from : state.mag; }

// ── Abilitazione articolo ↔ magazzino ──
function artMagRow(artId,mag){ return state.artMagIdx[artId+'|'+mag]||null; }
function isEnabled(artId,mag){ return !!artMagRow(artId,mag); }
function artMagsOf(artId){ return MAGAZZINI.map(m=>m.id).filter(id=>isEnabled(artId,id)); }
// Articolo "visto" da un magazzino: pezzi per scatola e scorta minima sono quelli del magazzino
function artById(id,mag=curMag()){
  const a=state.articoli.find(x=>x.id===id); if(!a) return null;
  const r=artMagRow(id,mag);
  return {...a, pezzi_scatola:r?.pezzi_scatola??null, scorta_min:r?.scorta_min??null};
}
function magArticoli(mag=state.mag){
  return state.articoli.filter(a=>isEnabled(a.id,mag)).map(a=>artById(a.id,mag));
}
function buildArtMagIdx(){
  state.artMagIdx={};
  state.artMag.forEach(r=>{ state.artMagIdx[r.articolo_id+'|'+r.magazzino]=r; });
}

// Elenco articoli selezionabili nella combobox della modale aperta
function comboPool(){
  if(state.modal?.type==='sposta'){
    const {from,to}=state.modal;
    return state.articoli.filter(a=>isEnabled(a.id,from)&&isEnabled(a.id,to)).map(a=>artById(a.id,from));
  }
  return magArticoli(state.mag);
}

function setMag(id){
  if(!userMags().includes(id)||id===state.mag) return;
  state.mag=id;
  // i filtri per tipo non validi nel nuovo magazzino vengono azzerati
  ['giac','mov','scad'].forEach(k=>{ const t=window['_'+k+'Tipo']; if(t&&t!=='_none'&&!tipoMags(state.tipi.find(x=>x.id===t)).includes(id)) window['_'+k+'Tipo']=''; });
  render();
}

function magPill(id,small=true){
  const m=magInfo(id);
  return `<span style="display:inline-flex;align-items:center;gap:5px;background:${m.bg};color:${m.color};border:1px solid ${m.color}66;border-radius:20px;font-size:${small?9:11}px;font-weight:700;padding:${small?'1px 8px':'3px 10px'};letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;filter:saturate(1.1) brightness(.85);">${m.nome}</span>`;
}

// Selettore del magazzino (all'inizio della barra delle pagine)
function magSwitchHTML(){
  const l=userMags();
  if(l.length<2) return `<div style="display:flex;align-items:center;padding:0 14px 0 0;flex-shrink:0;">${magPill(l[0]||'chirurgia',false)}</div>`;
  return `<div style="display:flex;align-items:center;padding:6px 14px 6px 0;flex-shrink:0;">
    <div style="display:flex;background:var(--grigio-sfondo);border:1px solid var(--bordo);border-radius:8px;padding:3px;gap:3px;">
      ${l.map(id=>{ const m=magInfo(id), on=id===state.mag; return `<button onclick="setMag('${id}')" title="Passa al magazzino ${m.nome}"
        style="border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;
        background:${on?m.color:'transparent'};color:${on?'#fff':'var(--grigio)'};box-shadow:${on?'0 1px 4px '+m.color+'55':'none'};">${m.nome}</button>`; }).join('')}
    </div>
  </div>`;
}

// ── Pagina Articoli: colonne per magazzino ──
function filtroMagOk(a){
  const f=window._artMag||'';
  if(!f) return true;
  const mags=artMagsOf(a.id);
  if(f==='entrambi') return MAGAZZINI.every(m=>mags.includes(m.id));
  if(f.startsWith('solo_')) return mags.length===1&&mags[0]===f.slice(5);
  return true;
}

function artMagToggle(id){
  const on=document.getElementById('am-en-'+id).checked;
  ['am-pz-','am-sm-'].forEach(p=>{ const el=document.getElementById(p+id); if(el) el.disabled=!on; });
  document.getElementById('am-box-'+id).style.background=on?'#fff':'var(--grigio-sfondo)';
}
// Cambiando tipo si aggiornano i magazzini consentiti
function artTipoChange(){
  const t=state.tipi.find(x=>x.id===document.getElementById('art-tipo').value);
  MAGAZZINI.forEach(m=>{
    const cb=document.getElementById('am-en-'+m.id); if(!cb) return;
    const allowed=!t||tipoMags(t).includes(m.id);
    cb.disabled=!allowed;
    if(!allowed) cb.checked=false;
    document.getElementById('am-note-'+m.id).textContent=allowed?'':'tipo non abilitato in questo magazzino';
    artMagToggle(m.id);
  });
}
function leggiArtMags(){
  return MAGAZZINI.filter(m=>document.getElementById('am-en-'+m.id)?.checked).map(m=>{
    const pz=parseInt(document.getElementById('am-pz-'+m.id).value);
    const sm=parseInt(document.getElementById('am-sm-'+m.id).value);
    return {magazzino:m.id, pezzi_scatola:(!isNaN(pz)&&pz>0)?pz:null, scorta_min:(!isNaN(sm)&&sm>=0)?sm:null};
  });
}

async function toggleUserMag(userId,magId){
  const u=state.utenti.find(x=>x.id===userId); if(!u) return;
  const cur=userMags(u);
  const next=cur.includes(magId)?cur.filter(x=>x!==magId):[...cur,magId];
  if(!next.length){ showToast('Un operatore deve avere accesso ad almeno un magazzino.','error'); return; }
  try{ await db.update('magazzino_utenti',{magazzini:next},`id=eq.${userId}`); await loadAll(); showToast('Accessi aggiornati.'); }
  catch(e){ showToast(e.message,'error'); }
}

  const from=state.mag, to=l.find(x=>x!==from);
  openModal({type:'sposta',from,to,preselectId});

function invertiSposta(){
  const m=state.modal; if(m?.type!=='sposta') return;
  const sel=document.getElementById('mov-art')?.value||null;
  openModal({type:'sposta',from:m.to,to:m.from,preselectId:sel});
}
async function submitSposta(){
  const errEl=document.getElementById('mov-err'); errEl.innerHTML='';
  const {from,to}=state.modal;
  const artId=document.getElementById('mov-art')?.value;
  if(!artId){ errEl.innerHTML=errBox('Seleziona un articolo.'); return; }
  const art=artById(artId,from);
  if(!isEnabled(artId,to)){ errEl.innerHTML=errBox(`Articolo non abilitato in ${magNome(to)}: abilitalo dalla pagina Articoli.`); return; }
  const noteUt=(document.getElementById('mov-note')?.value||'').trim();
  const lotti=calcLottiPerArticolo(artId,from);
  let gruppi=[]; // [{scad, qty, codici:[], isScatola, nScatole}]
  if(isSerial(art)){
    const selIds=[...(window._movCodSel||[])];
    const sel=state.codici.filter(c=>selIds.includes(c.id)&&c.stato==='carico'&&codMag(c)===from);
    if(!sel.length){ errEl.innerHTML=errBox('Seleziona almeno un codice da spostare.'); return; }
    const g={}; sel.forEach(c=>{ const k=c.scadenza||NO_SCAD_ISO; (g[k]=g[k]||[]).push(c); });
    gruppi=Object.entries(g).map(([scad,list])=>({scad,qty:list.length,codici:list,isScatola:false,nScatole:null}));
  } else {
    const scad=document.getElementById('mov-scad')?.value||'';
    const modalita=window._movModalita||'pezzi';
    const raw=parseInt(document.getElementById('mov-qty')?.value)||0;
    const qty=modalita==='scatole'?raw*(art.pezzi_scatola||0):raw;
    if(!scad){ errEl.innerHTML=errBox('Seleziona il lotto da spostare.'); return; }
    if(qty<=0){ errEl.innerHTML=errBox('Inserisci una quantità valida.'); return; }
    gruppi=[{scad,qty,codici:[],isScatola:modalita==='scatole',nScatole:modalita==='scatole'?raw:null}];
  }
  for(const gr of gruppi){
    if(gr.qty>(lotti[gr.scad]??0)){ errEl.innerHTML=errBox(`Lotto ${fmtData(gr.scad)}: disponibili in ${magNome(from)} solo ${fmt(lotti[gr.scad]??0)} ${art.um}.`); return; }
  }
  const btn=document.getElementById('mov-submit-btn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Spostamento…'; }
  const now=nowStr(), tid=uid();
  const who={utente:state.utente.username,nome_utente:state.utente.nome_completo};
  const nota=s=>[noteUt,s].filter(Boolean).join(' · ');
  const movs=[], aggCodici=[];
  gruppi.forEach(gr=>{
    const sId=uid(), cId=uid();
    const base={articolo_id:artId,quantita:gr.qty,scadenza:gr.scad,is_scatola:gr.isScatola,n_scatole:gr.nScatole,...who,data:now,trasferimento_id:tid};
    movs.push({...base,id:sId,tipo:'scarico',causale:CAUSALE_INVIO,    note:nota('verso '+magNome(to)),magazzino:from});
    movs.push({...base,id:cId,tipo:'carico', causale:CAUSALE_RICEZIONE,note:nota('da '+magNome(from)),magazzino:to});
    if(gr.codici.length) aggCodici.push({ids:gr.codici.map(c=>c.id),cId});
  });
  const tot=gruppi.reduce((s,g)=>s+g.qty,0);
  try{
    await db.insert('magazzino_movimenti',movs);        // scarico e carico nella stessa richiesta
    for(const u of aggCodici) await db.update('magazzino_articoli_codici',{magazzino:to,mov_carico_id:u.cId},`id=in.(${u.ids.join(',')})`);
    await db.insert('magazzino_log_accessi',{id:uid(),tipo:'sposta',utente:state.utente.username,nome_completo:state.utente.nome_completo,
      articolo_id:artId,quantita:tot,causale:`${magNome(from)} → ${magNome(to)}`,magazzino:from,data:now});
    await loadAll(); closeModal(); showToast(`Spostati ${fmt(tot)} ${art.um} in ${magNome(to)}.`);
  }catch(e){ errEl.innerHTML=errBox(e.message); if(btn){ btn.disabled=false; btn.innerHTML='Conferma spostamento'; } }
}

// ════════════════════════════════════════════════════════════════
// IMMAGINI ARTICOLI (OneDrive files@medicalgroup.it → cartella "magazzino")
// Il ponte è la Edge Function "magazzino-immagini": crea la sessione di
// upload (il file va direttamente da browser a Microsoft) e fornisce gli
// URL temporanei per visualizzare miniature e immagini.
// ════════════════════════════════════════════════════════════════
const IMG_FN = `${SUPA_URL}/functions/v1/magazzino-immagini`;
const IMG_BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const IMG_TTL = 45*60*1000;          // gli URL di Microsoft durano circa un'ora
const IMG_MAX_LATO = 1600;           // ridimensionamento prima dell'upload
state.imgUrls = {};                  // { [immagine_id]: { full, thumb, exp } }
let _imgLoading = false;

async function imgApi(action, payload={}){
  const r = await fetch(IMG_FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({action,...payload})});
  const d = await r.json().catch(()=>({ok:false,error:'Risposta non valida dal server immagini'}));
  if(!r.ok||!d.ok) throw new Error(d.error||('Errore server immagini ('+r.status+')'));
  return d;
}

// Miniatura cliccabile (vuota finché l'URL non arriva)
function thumbHTML(a,size=36){
  if(!a?.immagine_id) return '';
  const c=state.imgUrls[a.immagine_id];
  return `<img data-img-id="${escHtml(a.immagine_id)}" src="${c?.thumb||IMG_BLANK}" alt="" title="Apri immagine"
    onclick="event.stopPropagation();openModal({type:'img_art',id:'${a.id}'})"
    style="width:${size}px;height:${size}px;object-fit:cover;border-radius:6px;border:1px solid var(--bordo);background:var(--grigio-sfondo);cursor:zoom-in;flex-shrink:0;display:block;">`;
}

// Recupera gli URL mancanti/scaduti e aggiorna le <img> già a schermo
async function ensureImgUrls(){
  const now=Date.now();
  const applica=()=>document.querySelectorAll('img[data-img-id]').forEach(el=>{
    const c=state.imgUrls[el.dataset.imgId]; if(!c) return;
    const want=el.dataset.full==='1'?c.full:c.thumb;
    if(want&&el.getAttribute('src')!==want) el.src=want;
  });
  applica();
  if(_imgLoading) return;
  const ids=[...new Set(state.articoli.map(a=>a.immagine_id).filter(Boolean))].filter(id=>!(state.imgUrls[id]?.exp>now));
  if(!ids.length) return;
  _imgLoading=true;
  try{
    const d=await imgApi('urls',{ids});
    ids.forEach(id=>{ const it=d.items?.[id]; state.imgUrls[id]=it?{full:it.full,thumb:it.thumb,exp:now+IMG_TTL}:{full:'',thumb:'',exp:now+5*60*1000}; });
    applica();
  }catch(e){ console.warn('Immagini non disponibili:',e.message); }
  finally{ _imgLoading=false; }
}

    <input type="file" id="art-img-file" accept="image/*" style="display:none;" onchange="artImgPick(this.files&&this.files[0]);this.value='';">
    <div id="art-img-zone" tabindex="0" role="button" aria-label="Carica immagine"

function artImgDrag(on){

function artImgPick(file){
  const msg=document.getElementById('art-img-msg'); if(msg) msg.innerHTML='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ if(msg) msg.innerHTML=errBox('Il file scelto non è un\'immagine.'); return; }
  if(file.size>15*1024*1024){ if(msg) msg.innerHTML=errBox('Immagine troppo grande (massimo 15 MB).'); return; }
  const s=window._artImg;
  if(s.preview) URL.revokeObjectURL(s.preview);
  s.file=file; s.preview=URL.createObjectURL(file); s.remove=false;
  artImgRender();
}
function artImgRemove(){
  const s=window._artImg;

// Riduce le foto grandi (max 1600 px di lato, JPEG) prima dell'upload
async function preparaImmagine(file){
  try{
    const bmp=await createImageBitmap(file);
    const scala=Math.min(1,IMG_MAX_LATO/Math.max(bmp.width,bmp.height));
    if(scala===1&&file.size<=1.5*1024*1024){ bmp.close?.(); return file; }
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*scala); c.height=Math.round(bmp.height*scala);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(bmp,0,0,c.width,c.height); bmp.close?.();
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
    if(!blob) return file;
    return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
  }catch(e){ return file; }   // formato non decodificabile dal browser (es. HEIC): carico l'originale
}

async function caricaImmagine(codice,file){
  const f=await preparaImmagine(file);
  const {upload_url}=await imgApi('upload',{codice,file_nome:f.name,file_size:f.size,file_mime:f.type||'image/jpeg'});
  const r=await fetch(upload_url,{method:'PUT',headers:{'Content-Range':`bytes 0-${f.size-1}/${f.size}`},body:f});
  const item=await r.json().catch(()=>({}));
  if(!r.ok||!item.id) throw new Error('Upload su OneDrive non riuscito'+(item.error?.message?': '+item.error.message:''));
  return {id:item.id,nome:item.name||f.name};
}

// Applica all'articolo salvato le modifiche all'immagine fatte nella modale
async function syncArtImage(artId,codice){
  const s=window._artImg; if(!s||(!s.file&&!s.remove)) return;
  const old=s.currentId;
  if(s.file){
    const up=await caricaImmagine(codice,s.file);
    await db.update('magazzino_articoli',{immagine_id:up.id,immagine_nome:up.nome},`id=eq.${artId}`);
  } else if(s.remove){
    await db.update('magazzino_articoli',{immagine_id:null,immagine_nome:null},`id=eq.${artId}`);
  }
  if(old) imgApi('elimina',{id:old}).catch(e=>console.warn('Vecchia immagine non eliminata:',e.message));
  if(s.preview) URL.revokeObjectURL(s.preview);
  window._artImg=null;
}

// Un articolo usa i codici singoli se il suo tipo ha il flag attivo
// Scorta minima impostata (vale per tutti gli articoli)
function scortaAttiva(art){ return !!art && art.scorta_min!=null; }
function isSerial(art){
  if(!art||!art.tipo_id) return false;
  return !!state.tipi.find(t=>t.id===art.tipo_id)?.codice_singolo;
}
function codiciInCarico(artId,mag=curMag()){
  return state.codici
    .filter(c=>c.articolo_id===artId&&c.stato==='carico'&&codMag(c)===mag)
    .sort((a,b)=>(a.scadenza||NO_SCAD_ISO).localeCompare(b.scadenza||NO_SCAD_ISO)||a.codice.localeCompare(b.codice));
}
function findCodice(artId,codice){
  const cl=String(codice).toLowerCase();
  return state.codici.find(c=>c.articolo_id===artId&&c.codice.toLowerCase()===cl);
}
function splitCodici(raw){
  return String(raw||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
}

function codiciCaricoHTML(){
  return `<div style="${_codLbl}">
    <span>Codici prodotto <span style="color:var(--verde);">*</span> <span id="cod-count" style="font-weight:400;color:var(--grigio);"></span></span>
    <div style="display:flex;gap:6px;">

        onpaste="onCodPaste(event)" style="${inpStyle()}">
      <button type="button" onclick="addCodiciCarico(document.getElementById('cod-in').value)" style="${btnStyle('outline',true)}">Aggiungi</button>
    </div>
    <span style="${_codHint}">Un codice per ogni pezzo: la quantità è il numero di codici inseriti. Puoi incollare più codici separati da spazio, virgola o a capo.</span>

function onCodPaste(e){
  const txt=(e.clipboardData||window.clipboardData)?.getData('text')||'';
  if(splitCodici(txt).length>1){ e.preventDefault(); addCodiciCarico(e.target.value+' '+txt); }

function addCodiciCarico(raw){
  const artId=document.getElementById('mov-art')?.value;
  const inp=document.getElementById('cod-in');
  const errs=[];
  splitCodici(raw).forEach(c=>{
    if(window._movCodici.some(x=>x.codice.toLowerCase()===c.toLowerCase())){ errs.push(`${escHtml(c)}: già nell'elenco`); return; }
    const ex=findCodice(artId,c);
    if(ex&&ex.stato==='carico'){ errs.push(`${escHtml(c)}: già in carico${codMag(ex)!==state.mag?' in '+magNome(codMag(ex)):''}`); return; }
    window._movCodici.push({codice:c, existingId:ex?ex.id:null});
  });
  if(inp){ inp.value=''; inp.focus(); }
  const errEl=document.getElementById('cod-err');
  if(errEl) errEl.innerHTML=errs.length?`<div style="background:var(--rosso-chiaro);border:1px solid #c0392b44;border-radius:6px;color:var(--rosso);font-size:11px;font-weight:500;padding:8px 12px;">${errs.join('<br>')}</div>`:'';
  renderCodiciCarico();

function onCodQKey(e){
  if(e.key!=='Enter') return;
  e.preventDefault();
  const artId=document.getElementById('mov-art')?.value;

  const errEl=document.getElementById('cod-err');
  const disp=codiciInCarico(artId);
  let hit=disp.find(c=>c.codice.toLowerCase()===v.toLowerCase());
  if(!hit){ const f=disp.filter(c=>c.codice.toLowerCase().includes(v.toLowerCase())); if(f.length===1) hit=f[0]; }
  if(hit){
    window._movCodSel.add(hit.id);

  }

}

// ── Salvataggio movimenti con codici ──
async function submitMovimentoSerial(tipo,art){
  const errEl=document.getElementById('mov-err'); errEl.innerHTML='';
  const causale=document.getElementById('mov-causale')?.value;
  const note=document.getElementById('mov-note')?.value||null;
  const btn=document.getElementById('mov-submit-btn');
  const busy=on=>{ if(btn){ btn.disabled=on; btn.innerHTML=on?'<span class="spinner"></span>Salvataggio…':`Conferma ${tipo}`; } };
  const now=nowStr();
  const who={utente:state.utente.username,nome_utente:state.utente.nome_completo};
  const logRow=(q)=>({id:uid(),tipo,utente:state.utente.username,nome_completo:state.utente.nome_completo,articolo_id:art.id,quantita:q,causale,data:now,magazzino:state.mag});

  if(tipo==='carico'){
    const codici=window._movCodici||[];
    const noScad=document.getElementById('cb-no-scad')?.checked||false;
    const scad=noScad?NO_SCAD_ISO:(document.getElementById('mov-scad')?.value||'');
    if(!codici.length){ errEl.innerHTML=errBox('Inserisci almeno un codice prodotto.'); return; }
    if(!scad){ errEl.innerHTML=errBox('Inserisci la data di scadenza.'); return; }
    const movId=uid();
    const nuovi=codici.filter(c=>!c.existingId).map(c=>({id:uid(),articolo_id:art.id,codice:c.codice,scadenza:scad,stato:'carico',mov_carico_id:movId,data_carico:now,magazzino:state.mag}));
    const rientri=codici.filter(c=>c.existingId);
    busy(true);
    try{
      if(nuovi.length) await db.insert('magazzino_articoli_codici',nuovi);
      try{
        await db.insert('magazzino_movimenti',{id:movId,articolo_id:art.id,tipo:'carico',quantita:codici.length,causale,scadenza:scad,note,is_scatola:false,n_scatole:null,...who,data:now,magazzino:state.mag});
      }catch(e){
        if(nuovi.length) await db.delete('magazzino_articoli_codici',`id=in.(${nuovi.map(n=>n.id).join(',')})`).catch(()=>{});
        throw e;
      }
      if(rientri.length) await db.update('magazzino_articoli_codici',
        {stato:'carico',scadenza:scad,mov_carico_id:movId,data_carico:now,mov_scarico_id:null,data_scarico:null,magazzino:state.mag},
        `id=in.(${rientri.map(r=>r.existingId).join(',')})`);
      await db.insert('magazzino_log_accessi',logRow(codici.length));
      await loadAll(); closeModal(); showToast(`Carico registrato: ${codici.length} ${codici.length===1?'codice':'codici'}.`);
    }catch(e){
      const m=String(e.message||e);
      errEl.innerHTML=errBox(m.includes('duplicate')||m.includes('23505')?'Uno o più codici esistono già per questo articolo. Ricarica la pagina e riprova.':m);
      busy(false);
    }
    return;
  }

  // Scarico: un movimento per ogni lotto (scadenza) dei codici selezionati
  const selIds=[...(window._movCodSel||[])];
  const sel=state.codici.filter(c=>selIds.includes(c.id)&&c.stato==='carico');
  if(!sel.length){ errEl.innerHTML=errBox('Seleziona almeno un codice da scaricare.'); return; }
  const gruppi={};
  sel.forEach(c=>{ const k=c.scadenza||NO_SCAD_ISO; (gruppi[k]=gruppi[k]||[]).push(c); });
  const lotti=calcLottiPerArticolo(art.id);
  for(const [scad,list] of Object.entries(gruppi)){
    if(list.length>(lotti[scad]??0)){ errEl.innerHTML=errBox(`Lotto ${fmtData(scad)}: la giacenza del lotto (${fmt(lotti[scad]??0)}) è inferiore ai codici selezionati (${list.length}).`); return; }
  }
  busy(true);
  try{
    for(const [scad,list] of Object.entries(gruppi)){
      const movId=uid();
      await db.insert('magazzino_movimenti',{id:movId,articolo_id:art.id,tipo:'scarico',quantita:list.length,causale,scadenza:scad,note,is_scatola:false,n_scatole:null,...who,data:now,magazzino:state.mag});
      await db.update('magazzino_articoli_codici',{stato:'scaricato',mov_scarico_id:movId,data_scarico:now},`id=in.(${list.map(c=>c.id).join(',')})`);
      await db.insert('magazzino_log_accessi',logRow(list.length));
    }
    await loadAll(); closeModal(); showToast(`Scarico registrato: ${sel.length} ${sel.length===1?'codice':'codici'}.`);
  }catch(e){ errEl.innerHTML=errBox(e.message); busy(false); }
}

// Genera il prossimo codice articolo in formato ARTXXX
function nextCodice(){
  const nums = state.articoli
    .map(a => a.codice.match(/^ART(\d+)$/i))
    .filter(Boolean)
    .map(m => parseInt(m[1]));
  const max = nums.length ? Math.max(...nums) : 0;
  return 'ART' + String(max + 1).padStart(3, '0');
}

function escHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
